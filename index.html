  const first = gl(a, b);
  let v = rec(a, b, first, 1e-12 * (1 + Math.abs(first)), 0);
  if (hitLimit) {
    // 끝점 근처에서 값이 무한대로 커지는 경우: x = a + (b−a)(3t² − 2t³) 로 바꿔 끝부분을 부드럽게 펴서 다시 계산
    G2 = (t) => { const u = 3 * t * t - 2 * t * t * t; return F(a + (b - a) * u) * (b - a) * 6 * t * (1 - t); };
    count = 0; hitLimit = false;
    const f2 = gl(0, 1);
    v = rec(0, 1, f2, 1e-12 * (1 + Math.abs(f2)), 0);
  }
  if (!Number.isFinite(v)) throw new CalcError("적분값이 발산해요");
  return v;
}

/* 문자열 수식 → 숫자 (오류면 CalcError) */
function calculate(src) {
  const tree = new Parser(tokenize(src), false).parseAll();
  const ctx = { deg: state.deg, ans: state.ans, _p: PV };          // _p: 따로 입력한 문자 값
  if (tree.type === "func" && tree.name === "grad") {               // ∇f 는 벡터 { vec: [...] } 로 돌려줌
    const vec = calcGrad(tree, ctx);
    if (vec.some((q) => !Number.isFinite(q))) throw new CalcError("이 점에서는 기울기 벡터를 구할 수 없어요");
    return { vec };
  }
  const v = evaluate(tree, ctx);
  if (Number.isNaN(v)) throw new CalcError("정의되지 않는 계산이에요");
  if (!Number.isFinite(v)) throw new CalcError("값이 너무 커서 계산할 수 없어요");
  return v;
}

/* =====================================================================
   4. 결과 숫자 보기 좋게 만들기
   - 12자리로 반올림해서 0.1+0.2 = 0.30000000000000004 같은 오차 없애기
   - 아주 크거나 작은 수는 1.23×10^15 처럼 표시
   ===================================================================== */
function cleanNumber(x) { return Number(x.toPrecision(12)); }

function formatNumber(x) {
  const v = cleanNumber(x);
  if (v === 0) return { html: "0", plain: "0", insert: "0" };
  const exp = Math.floor(Math.log10(Math.abs(v)));
  if (exp >= 12 || exp < -6) {
    // 과학적 표기
    let m = v / Math.pow(10, exp);
    let mStr = String(Number(m.toPrecision(10)));
    let e = exp;
    if (Math.abs(Number(mStr)) >= 10) { mStr = String(Number((Number(mStr) / 10).toPrecision(10))); e += 1; }
    return {
      html: `${mStr.replace("-", "−")}<span class="m-sci">×10<span class="m-sup">${String(e).replace("-", "−")}</span></span>`,
      plain: `${mStr}×10^${e}`,
      insert: `(${mStr}×10^(${e}))`,
    };
  }
  let s = String(v);
  if (/e/.test(s)) s = v.toFixed(12).replace(/\.?0+$/, "");
  return { html: s.replace("-", "−"), plain: s, insert: v < 0 ? `(${s})` : s };
}

/* 분수로 바꿀 수 있으면 분수로 (예: 0.75 → 3/4) */
function toFraction(x) {
  const v = cleanNumber(x);
  if (!Number.isFinite(v) || Number.isInteger(v) || Math.abs(v) >= 1e7) return null;
  let h1 = 1, h0 = 0, k1 = 0, k0 = 1, b = Math.abs(v);
  for (let i = 0; i < 30; i++) {                // 연분수로 근사
    const a = Math.floor(b);
    [h1, h0] = [a * h1 + h0, h1];
    [k1, k0] = [a * k1 + k0, k1];
    if (k1 > 1000) return null;
    if (Math.abs(Math.abs(v) - h1 / k1) < 1e-10 * Math.max(1, Math.abs(v))) {
      return k1 === 1 ? null : { n: (v < 0 ? -1 : 1) * h1, d: k1 };
    }
    b = 1 / (b - a);
    if (!Number.isFinite(b)) break;
  }
  return null;
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }

/* =====================================================================
   5. 교과서 모양 수식 입력기
   - 수식을 "줄(row)" 과 "상자(node)" 로 저장
     · 줄: 항목들의 배열 (숫자, 기호, 상자)
     · 상자: 분수, 지수, 루트, 괄호, 함수 등. 상자 안에는 빈칸(줄)이 1~2개 있음
       예) 분수 = { t:"frac", num:[...], den:[...] }
   - 커서는 "어느 줄의 몇 번째 자리" 로 기억
   - 계산할 때는 줄을 글자 수식 "((1+2)÷(3+4))" 로 바꿔서 위의 계산기에 넘김
   ===================================================================== */

// 상자 종류별 빈칸 이름 (순서 = 커서가 지나가는 순서)
const SLOTS = {
  frac: ["num", "den"],     // 분수: 분자, 분모
  pow: ["exp"],             // 지수 (앞에 있는 것의 거듭제곱)
  sqrt: ["body"],           // 제곱근
  root: ["idx", "body"],    // 거듭제곱근: 차수, 안쪽
  par: ["body"],            // 괄호
  func: ["body"],           // 함수 하나짜리: sin( ), log( ) 등
  func2: ["a", "b"],        // 값 두 개 함수: mod(a, b), gcd(a, b)
  logb: ["base", "arg"],    // 밑이 있는 로그
  ncr: ["n", "r"],          // 조합
  npr: ["n", "r"],          // 순열
  abs: ["body"],            // 절댓값
  deriv: ["v", "body", "at"],         // 미분계수: d/d변수(식)|변수=값   (v: 변수 칸, 처음엔 x)
  deriv1: ["v", "body"],              // 도함수: d/d변수(식)  (그래프용)
  integ: ["lo", "hi", "body", "v"],   // 정적분: 아래끝, 위끝, 식, d변수
  grad: ["body", "pt"],               // 그래디언트: ∇(식)|(x,y,z)=(점)
};

// 새 빈 줄 만들기 (parent: 이 줄을 품고 있는 상자 정보)
function mkRow(parent) { const r = []; r.parent = parent || null; return r; }
// 글자 하나짜리 항목
function mkChar(v) { return { t: "c", v }; }
// 상자 만들기 (빈칸 줄들을 함께 만듦)
function mkNode(t, props) {
  const n = Object.assign({ t }, props || {});
  SLOTS[t].forEach((k) => { n[k] = mkRow({ node: n, key: k }); });
  if (n.v) fillChars(n.v, "x");     // 미분·적분 변수 칸은 x 로 시작 (눌러서 y, z, t 등으로 바꿀 수 있음)
  return n;
}
function isNode(it) { return !!SLOTS[it.t]; }
function slotRows(n) { return SLOTS[n.t].map((k) => n[k]); }
// 항목을 줄에 넣을 때, 그 항목이 어느 줄에 있는지 기록 (커서 이동에 필요)
function placeItems(row, items, at) {
  row.splice(at, 0, ...items);
  items.forEach((it) => { it.ownerRow = row; });
}
// 줄에 글자들 채우기 (예: 지수 "2")
function fillChars(row, text) { placeItems(row, [...text].map(mkChar), row.length); }

// 줄 깊은 복사 (기록 저장, 기록 불러오기용)
function cloneRow(row, parent) {
  const nr = mkRow(parent);
  row.forEach((it) => {
    let c;
    if (isNode(it)) {
      c = Object.assign({}, it);
      SLOTS[it.t].forEach((k) => { c[k] = cloneRow(it[k], { node: c, key: k }); });
    } else c = { t: "c", v: it.v, lit: it.lit };
    c.ownerRow = nr;
    nr.push(c);
  });
  return nr;
}

/* ----- 입력기 상태 ----- */
let root = mkRow(null);              // 맨 바깥 줄
let cur = { row: root, idx: 0 };     // 커서 위치

/* ---------------------------------------------------------------------
   5-1. 글자 수식으로 바꾸기 (계산용)
   --------------------------------------------------------------------- */
// 등호·부등호 (그래프에서만 입력)
const REL = ["=", "<", ">", "≤", "≥"];
const isRel = (it) => !isNode(it) && REL.includes(it.v);
// 이 기호들 다음은 '새 값의 시작' (음수 부호 판단, 지수 밑 판단, 분수 버튼이 가져갈 범위)
const OPERATOR_CHARS = ["+", "-", "×", "÷", ","].concat(REL);
function serialize(row) {
  if (row.length === 0) return "□";                  // 빈칸은 □ 로 → "빈칸을 채워 주세요"
  let s = "";
  // 앞이 글자로 끝나고 새 조각이 글자로 시작하면 사이에 × (a 다음 sin 이 asin 으로 읽히는 것 방지)
  const join = (a, b) => (/[A-Za-z]$/.test(a) && /^[A-Za-z]/.test(b) ? a + "×" + b : a + b);
  row.forEach((it, i) => {
    if (!isNode(it)) { s = join(s, it.v); return; }
    const S = (k) => serialize(it[k]);
    const s0 = s; s = "";
    switch (it.t) {
      case "frac": s += `((${S("num")})÷(${S("den")}))`; break;
      case "pow": {
        // 지수 앞에 밑이 없으면 빈칸
        const prev = row[i - 1];
        if (!prev || (!isNode(prev) && OPERATOR_CHARS.includes(prev.v))) s += "□";
        s += `^(${S("exp")})`; break;
      }
      case "sqrt": s += `√(${S("body")})`; break;
      case "root": s += `root(${S("idx")},${S("body")})`; break;
      case "par": s += `(${S("body")})`; break;
      case "func": s += `${it.name}(${it.body.length ? serialize(it.body) : (it.name === "rand" ? "" : "□")})`; break;
      case "func2": s += `${it.name}(${S("a")},${S("b")})`; break;
      case "logb": s += `log(${S("base")},${S("arg")})`; break;
      case "ncr": s += `nCr(${S("n")},${S("r")})`; break;
      case "npr": s += `nPr(${S("n")},${S("r")})`; break;
      case "abs": s += `abs(${S("body")})`; break;
      case "deriv": s += `diff(${S("body")},${S("at")},${S("v")})`; break;
      case "deriv1": s += `diff(${S("body")},${baseLetter(it.v) || "x"},${S("v")})`; break;   // 지금 변수 값에서의 미분 = 도함수
      case "integ": s += `integ(${S("body")},${S("lo")},${S("hi")},${S("v")})`; break;
      case "grad": s += `grad(${S("body")},${S("pt")})`; break;
    }
    s = join(s0, s);
  });
  return s;
}

/* ---------------------------------------------------------------------
   5-2. 화면에 그리기
   - 편집용: 항목마다 data-rid(줄 번호), data-i(자리) 를 달아서 눌러서 커서를 옮길 수 있게
   - 기록용(static): 번호와 커서 없이 모양만
   --------------------------------------------------------------------- */
let rowRegistry = [];      // data-rid 번호 → 줄
let staticMode = false;    // true 면 기록용 그리기
const CURSOR = '<span class="cur"></span>';
const SVG_SQRT = '<svg class="sign" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0,62 L22,52 L50,98 L100,1"/></svg>';
const SVG_LP = '<svg class="pl" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M85,2 Q5,50 85,98"/></svg>';
const SVG_RP = '<svg class="pr" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M15,2 Q95,50 15,98"/></svg>';
// 미분 기호 d/d변수 (작은 분수 모양, 변수 칸은 눌러서 바꿀 수 있음)
const ddx = (vHtml, single) => `<span class="m-frac m-ddx"><span class="fn">d</span><span class="fd">d${single ? vHtml : "(" + vHtml + ")"}</span></span>`;
// 변수 칸 안의 첫 문자 (d/d(y²) 의 y)
function baseLetter(row) {
  for (const it of row) {
    if (isNode(it)) { const b = slotRows(it).map(baseLetter).find(Boolean); if (b) return b; }
    else if (/^[a-z]$/.test(it.v) && it.v !== "e") return it.v;
  }
  return "";
}
// 변수 칸이 문자 하나뿐인지 (아니면 d( ) 로 괄호를 붙여 보여 줌)
const singleVar = (n) => n.v.length <= 1 && (n.v.length === 0 || !isNode(n.v[0]));
// 변수 칸의 글자 (|x=값 에 보여 줄 이름)
const varText = (n) => (singleVar(n) ? (n.v.length ? n.v[0].v : "□") : baseLetter(n.v) || "□");
// 함수 이름을 보기 좋게
const FUNC_LABEL = {
  asin: "sin<span class='m-sup'>−1</span>", acos: "cos<span class='m-sup'>−1</span>", atan: "tan<span class='m-sup'>−1</span>",
  asinh: "sinh<span class='m-sup'>−1</span>", acosh: "cosh<span class='m-sup'>−1</span>", atanh: "tanh<span class='m-sup'>−1</span>",
  mean: "평균", round: "반올림", floor: "내림", ceil: "올림", rand: "난수",
};

function renderRow(row) {
  const rid = staticMode ? -1 : rowRegistry.push(row) - 1;
  const ridAttr = staticMode ? "" : ` data-rid="${rid}"`;
  const here = !staticMode && cur.row === row;
  if (row.length === 0) {
    // 빈칸: 커서가 들어와 있으면 강조
    return `<span class="row"${ridAttr}><span class="m-ph${here ? " on" : ""}">${here ? CURSOR : ""}</span></span>`;
  }
  let html = "";
  row.forEach((it, i) => {
    if (here && cur.idx === i) html += CURSOR;
    html += renderItem(it, rid, i, row);
  });
  if (here && cur.idx === row.length) html += CURSOR;
  return `<span class="row"${ridAttr}>${html}</span>`;
}

function renderItem(it, rid, i, row) {
  const a = staticMode ? "" : ` data-rid="${rid}" data-i="${i}"`;
  const R = (k) => renderRow(it[k]);
  if (!isNode(it)) {
    const v = it.v;
    if (v === "+" || v === "-" || v === "×" || v === "÷") {
      // 맨 앞이나 다른 기호 바로 뒤의 - 는 음수 부호라서 띄어 쓰지 않음
      const prev = row[i - 1];
      const unary = v === "-" && (!prev || (!isNode(prev) && OPERATOR_CHARS.includes(prev.v)));
      const sym = { "+": "+", "-": "−", "×": "×", "÷": "÷" }[v];
      return unary ? `<span${a}>−</span>` : `<span class="m-op"${a}>${sym}</span>`;
    }
    if (v === ",") return `<span class="m-comma"${a}>,</span>`;
    if (v === "e") return `<span class="m-e"${a}>e</span>`;
    if (v === "Ans") return `<span class="m-ans"${a}>Ans</span>`;
    if (v === "x" || v === "y") return `<span class="m-var"${a}>${v}</span>`;   // 변수 x, y (기울임)
    if (REL.includes(v)) return `<span class="m-rel"${a}>${v}</span>`;            // 등호, 부등호
    if (/^[A-Za-z]$/.test(v)) return `<span class="m-var"${a}>${v}</span>`;   // 문자 (계수·상수)
    return `<span${a}>${esc(v)}</span>`;
  }
  switch (it.t) {
    case "frac": return `<span class="m-frac"${a}><span class="fn">${R("num")}</span><span class="fd">${R("den")}</span></span>`;
    case "pow": {
      const prev = row[i - 1];
      const noBase = !prev || (!isNode(prev) && OPERATOR_CHARS.includes(prev.v));
      return `${noBase ? '<span class="m-ph"></span>' : ""}<span class="m-sup"${a}>${R("exp")}</span>`;
    }
    case "sqrt": return `<span class="m-sqrt"${a}>${SVG_SQRT}<span class="body">${R("body")}</span></span>`;
    case "root": return `<span class="m-sqrt has-idx"${a}><span class="idx">${R("idx")}</span>${SVG_SQRT}<span class="body">${R("body")}</span></span>`;
    case "par": {
      // 분자·분모·지수 안에 괄호 하나만 있으면 괄호를 그리지 않음 (분수 선이 괄호 역할)
      // 단, 커서가 그 괄호 안에 있을 때는 보여 줘서 지금 괄호 안을 쓰고 있다는 걸 알게 함
      const pn = row.parent && row.parent.node;
      if (row.length === 1 && pn && (pn.t === "frac" || pn.t === "pow") && it.body.length && !cursorInside(it)) {
        return `<span${a}>${R("body")}</span>`;
      }
      return `<span class="m-par"${a}>${SVG_LP}${R("body")}${SVG_RP}</span>`;
    }
    case "func": {
      if (it.name === "rand") return `<span class="m-fn"${a}>난수</span>`;
      if (it.name === "exp") return `<span${a}><span class="m-e">e</span><span class="m-sup">${R("body")}</span></span>`;
      return `<span${a}><span class="m-fn">${FUNC_LABEL[it.name] || it.name}</span><span class="m-par">${SVG_LP}${R("body")}${SVG_RP}</span></span>`;
    }
    case "func2": return `<span${a}><span class="m-fn">${it.name}</span><span class="m-par">${SVG_LP}${R("a")}<span class="m-comma">,</span>${R("b")}${SVG_RP}</span></span>`;
    case "logb": return `<span${a}><span class="m-fn">log</span><span class="m-sub">${R("base")}</span><span class="m-par">${SVG_LP}${R("arg")}${SVG_RP}</span></span>`;
    case "ncr": case "npr":
      return `<span${a}><span class="m-sub">${R("n")}</span>${it.t === "ncr" ? "C" : "P"}<span class="m-sub">${R("r")}</span></span>`;
    case "abs": return `<span class="m-abs"${a}>${R("body")}</span>`;
    case "deriv":    // d/d변수 (식) |변수=값
      return `<span${a}>${ddx(R("v"), singleVar(it))}<span class="m-par">${SVG_LP}${R("body")}${SVG_RP}</span><span class="m-at"><span class="m-sub">${varText(it)}=${R("at")}</span></span></span>`;
    case "deriv1":   // d/d변수 (식)
      return `<span${a}>${ddx(R("v"), singleVar(it))}<span class="m-par">${SVG_LP}${R("body")}${SVG_RP}</span></span>`;
    case "integ":    // ∫ 아래끝~위끝 식 d변수
      return `<span class="m-int"${a}><span class="m-intsign">∫</span><span class="m-lim"><span class="hi">${R("hi")}</span><span class="lo">${R("lo")}</span></span>${R("body")}<span class="m-dx">d${R("v")}</span></span>`;
    case "grad": {   // ∇ (식) |(x,y,z)=(점)
      const have = it.pt.length ? it.pt.filter((q) => !isNode(q) && q.v === ",").length + 1 : 1;   // 넣은 좌표 개수
      const need = hasLetter(it.body, "z") ? 3 : hasLetter(it.body, "y") ? 2 : 1;                     // 식에 쓰인 x, y, z
      const nv = Math.min(3, Math.max(have, need));
      const vars = ["x", "y", "z"].slice(0, nv).map((q) => `<i>${q}</i>`).join(",");
      const ghost = Array(Math.max(0, nv - have)).fill(',<span class="m-ph ghost"></span>').join("");   // 아직 안 넣은 좌표 자리
      return `<span${a}><span class="m-nabla">∇</span><span class="m-par">${SVG_LP}${R("body")}${SVG_RP}</span><span class="m-at"><span class="m-sub">(${vars})=(${R("pt")}${ghost})</span></span></span>`;
    }
  }
  return "";
}

// 줄 안(상자 안까지)에 특정 문자가 있는지
function hasLetter(row, c) { return row.some((it) => (isNode(it) ? slotRows(it).some((r) => hasLetter(r, c)) : it.v === c)); }
// 커서가 이 상자 안에 있는지
function cursorInside(n) {
  if (staticMode) return false;
  let row = cur.row;
  while (row.parent) { if (row.parent.node === n) return true; row = row.parent.node.ownerRow; }
  return false;
}
// 기록 목록용: 커서 없이 모양만
function renderStatic(row) {
  staticMode = true;
  try { return renderRow(row); } finally { staticMode = false; }
}

/* ---------------------------------------------------------------------
   5-3. 커서 이동
   --------------------------------------------------------------------- */
// 상자 밖으로 나가기 (오른쪽): 다음 빈칸이 있으면 그리로, 없으면 상자 뒤로
function exitRight() {
  const p = cur.row.parent;
  if (!p) return false;
  const n = p.node, rows = slotRows(n), k = rows.indexOf(cur.row);
  if (k < rows.length - 1) cur = { row: rows[k + 1], idx: 0 };
  else cur = { row: n.ownerRow, idx: n.ownerRow.indexOf(n) + 1 };
  return true;
}
// 상자 밖으로 나가기 (왼쪽)
function exitLeft() {
  const p = cur.row.parent;
  if (!p) return false;
  const n = p.node, rows = slotRows(n), k = rows.indexOf(cur.row);
  if (k > 0) cur = { row: rows[k - 1], idx: rows[k - 1].length };
  else cur = { row: n.ownerRow, idx: n.ownerRow.indexOf(n) };
  return true;
}
function moveRight() {
  const it = cur.row[cur.idx];
  if (!it) return exitRight();
  if (isNode(it)) cur = { row: slotRows(it)[0], idx: 0 };   // 상자 안으로 들어가기
  else cur.idx++;
  return true;
}
function moveLeft() {
  const it = cur.row[cur.idx - 1];
  if (!it) return exitLeft();
  if (isNode(it)) { const rows = slotRows(it), last = rows[rows.length - 1]; cur = { row: last, idx: last.length }; }
  else cur.idx--;
  return true;
}
// 위/아래 (분수의 분자 ↔ 분모)
function moveVertical(dir) {
  let row = cur.row;
  while (row.parent) {
    const n = row.parent.node, k = row.parent.key;
    if (n.t === "frac" && ((dir > 0 && k === "num") || (dir < 0 && k === "den"))) {
      const target = dir > 0 ? n.den : n.num;
      cur = { row: target, idx: Math.min(cur.row === row ? cur.idx : target.length, target.length) };
      return true;
    }
    row = n.ownerRow;
  }
  return false;
}
// 지금 커서를 품고 있는 가장 안쪽 상자 밖으로 나가기
function exitNode() {
  const p = cur.row.parent;
  if (!p) return false;
  const n = p.node;
  cur = { row: n.ownerRow, idx: n.ownerRow.indexOf(n) + 1 };
  return true;
}
/* 괄호 씌우기: 커서 앞의 덩어리를 괄호로 감싸고, 다시 누를 때마다 앞쪽으로 한 덩어리씩 넓힘
   예) 1+2×3| → 1+2×(3) → 1+(2×3) → (1+2×3)      (등호·부등호는 넘어가지 않음) */
function wrapParen() {
  const row = cur.row, end = cur.idx;
  const prev = row[end - 1];
  let start;
  if (prev && prev.t === "par") {
    // 바로 앞이 괄호면 넓히기: 괄호 앞의 연산 기호와 그 앞 덩어리까지
    let j = end - 1;
    if (j === 0) { toast("이미 이 칸의 식 전체를 괄호로 감쌌어요"); return false; }
    if (isRel(row[j - 1])) { toast("등호·부등호 앞까지만 감쌀 수 있어요"); return false; }
    if (!isOperandItem(row[j - 1])) j--;                       // 연산 기호
    while (j > 0 && isOperandItem(row[j - 1])) j--;             // 그 앞 덩어리
    start = j;
    const inner = row.slice(start, end - 1).concat(prev.body.slice());
    row.splice(start, end - start);
    const n = mkNode("par");
    placeItems(n.body, inner, 0);
    placeItems(row, [n], start);
    cur = { row, idx: start + 1 };
    return true;
  }
  let j = end;
  while (j > 0 && isOperandItem(row[j - 1])) j--;
  if (j === end) { toast("커서 앞에 괄호로 감쌀 식이 없어요"); return false; }
  start = j;
  const items = row.splice(start, end - start);
  const n = mkNode("par");
  placeItems(n.body, items, 0);
  placeItems(row, [n], start);
  cur = { row, idx: start + 1 };
  return true;
}
// ")" 키: 커서를 품은 괄호(또는 함수 괄호) 밖으로 나가기. 괄호가 없으면 가장 안쪽 상자 밖으로
const PAREN_TYPES = ["par", "func", "func2", "logb", "abs", "sqrt", "root", "deriv", "deriv1", "integ", "grad"];   // 괄호로 닫히는 상자들
function exitParen() {
  let row = cur.row, target = null;
  while (row.parent) {
    const n = row.parent.node;
    if (PAREN_TYPES.includes(n.t) && !n.implicit) { target = n; break; }
    row = n.ownerRow;
  }
  if (!target) {
    if (cur.row.parent) return exitNode();
    // 맨 바깥에서 ")" : 커서 앞의 식 전체(등호·부등호 뒤부터)를 괄호로 감싸기
    let j = cur.idx;
    while (j > 0 && !isRel(cur.row[j - 1])) j--;
    if (j === cur.idx) return false;
    const items = cur.row.splice(j, cur.idx - j);
    const n = mkNode("par");
    placeItems(n.body, items, 0);
    placeItems(cur.row, [n], j);
    cur = { row: cur.row, idx: j + 1 };
    return true;
  }
  const owner = target.ownerRow, at = owner.indexOf(target);
  cur = { row: owner, idx: at + 1 };
  return true;
}
/* 키보드로 한 줄 수식을 칠 때: 1/2+1/3, 2^3+1, sin30+cos60 처럼
   분모·지수·괄호 없이 시작한 함수 끝에서 + − × ÷ , 를 치면 자동으로 밖으로 나옴
   (버튼으로 입력할 때는 빈칸이 눈에 보이므로 이 규칙을 쓰지 않음) */
function autoExitForTyping() {
  for (;;) {
    const p = cur.row.parent;
    if (!p || cur.idx !== cur.row.length || cur.row.length === 0) return;
    const n = p.node;
    const linear = (n.t === "frac" && p.key === "den") || n.t === "pow" || n.implicit;
    if (!linear) return;
    if (n.implicit) n.implicit = false;
    exitNode();
  }
}

/* ---------------------------------------------------------------------
   5-4. 넣기
   --------------------------------------------------------------------- */
function insertItems(items) { placeItems(cur.row, items, cur.idx); cur.idx += items.length; }
function insertChar(v) { insertItems([mkChar(v)]); }
// 상자를 넣고 커서를 첫 빈칸(또는 지정한 빈칸)으로
function insertNode(n, enterKey) {
  placeItems(cur.row, [n], cur.idx);
  const key = enterKey || SLOTS[n.t][0];
  cur = { row: n[key], idx: n[key].length };
}

// 분수 버튼: 커서 앞에 있는 수(또는 상자)를 분자로 가져가고 커서는 분모로
function isOperandItem(it) {
  if (!it) return false;
  if (isNode(it)) return true;
  return !OPERATOR_CHARS.includes(it.v);
}
function insertFraction() {
  const row = cur.row;
  let j = cur.idx;
  while (j > 0 && isOperandItem(row[j - 1])) j--;
  const taken = row.splice(j, cur.idx - j);
  const f = mkNode("frac");
  placeItems(f.num, taken, 0);
  placeItems(row, [f], j);
  cur = taken.length ? { row: f.den, idx: 0 } : { row: f.num, idx: 0 };
}
// 지수: exp 를 주면 채우고 커서는 상자 뒤에, 안 주면 지수 빈칸으로
function insertPower(exp) {
  const n = mkNode("pow");
  if (exp) {
    fillChars(n.exp, exp);
    placeItems(cur.row, [n], cur.idx);
    cur.idx++;
  } else insertNode(n);
}

// 함수 이름 글자들을 상자로 바꾸는 표 (키보드로 sin, sqrt, pi 등을 칠 때)
const NAME_TO_NODE = {
  sin: () => mkNode("func", { name: "sin" }), cos: () => mkNode("func", { name: "cos" }), tan: () => mkNode("func", { name: "tan" }),
  asin: () => mkNode("func", { name: "asin" }), acos: () => mkNode("func", { name: "acos" }), atan: () => mkNode("func", { name: "atan" }),
  sinh: () => mkNode("func", { name: "sinh" }), cosh: () => mkNode("func", { name: "cosh" }), tanh: () => mkNode("func", { name: "tanh" }),
  asinh: () => mkNode("func", { name: "asinh" }), acosh: () => mkNode("func", { name: "acosh" }), atanh: () => mkNode("func", { name: "atanh" }),
  log: () => mkNode("func", { name: "log" }), ln: () => mkNode("func", { name: "ln" }), exp: () => mkNode("func", { name: "exp" }),
  floor: () => mkNode("func", { name: "floor" }), ceil: () => mkNode("func", { name: "ceil" }), round: () => mkNode("func", { name: "round" }),
  max: () => mkNode("func", { name: "max" }), min: () => mkNode("func", { name: "min" }), mean: () => mkNode("func", { name: "mean" }),
  sqrt: () => mkNode("sqrt"), cbrt: () => { const n = mkNode("root"); fillChars(n.idx, "3"); return n; },
  abs: () => mkNode("abs"), mod: () => mkNode("func2", { name: "mod" }), gcd: () => mkNode("func2", { name: "gcd" }),
  lcm: () => mkNode("func2", { name: "lcm" }), ncr: () => mkNode("ncr"), npr: () => mkNode("npr"),
  pi: () => mkChar("π"), ans: () => mkChar("Ans"), rand: () => mkNode("func", { name: "rand" }),
  // 키보드로 diff → 미분(그래프에서는 도함수), int / integ → 정적분
  diff: () => mkNode(state.mode === "graph" ? "deriv1" : "deriv"), int: () => mkNode("integ"), integ: () => mkNode("integ"),
  grad: () => mkNode("grad"),
};
const NAME_LIST = Object.keys(NAME_TO_NODE).sort((a, b) => b.length - a.length);
// 커서 앞에 연달아 있는 영어 글자들
function trailingLetters() {
  let s = "", j = cur.idx;
  while (j > 0) {
    const it = cur.row[j - 1];
    if (isNode(it) || it.lit || !/^[A-Za-z]$/.test(it.v)) break;
    s = it.v + s; j--;
  }
  return s;
}
// 커서 앞 글자가 함수 이름으로 끝나면 상자로 바꾸기
// force=false: 더 긴 이름이 있을 수 있으면(sin → sinh) 기다림
function convertName(force) {
  const run = trailingLetters().toLowerCase();
  if (!run) return false;
  const name = NAME_LIST.find((nm) => run.endsWith(nm));
  if (!name) return false;
  if (!force && NAME_LIST.some((nm) => nm !== name && nm.startsWith(name))) return false;
  cur.row.splice(cur.idx - name.length, name.length);
  cur.idx -= name.length;
  const made = NAME_TO_NODE[name]();
  if (!isNode(made)) { insertItems([made]); return "char"; }
  if (made.t === "func" && made.name === "rand") { placeItems(cur.row, [made], cur.idx); cur.idx++; return "char"; }
  made.implicit = true;          // 괄호를 직접 치지 않고 만든 함수 (sin30 처럼)
  insertNode(made, made.t === "root" || made.t === "deriv" || made.t === "deriv1" ? "body" : null);
  return "node";
}

/* ---------------------------------------------------------------------
   5-5. 지우기 (⌫)
   - 글자는 한 글자씩
   - 상자 바로 뒤에서 누르면: 빈 상자면 통째로 지우고, 내용이 있으면 상자 안으로 들어감
   - 빈칸 맨 앞에서 누르면: 상자를 풀어서 안의 내용만 남김
   --------------------------------------------------------------------- */
function nodeIsEmpty(n) {
  if (n.v) return SLOTS[n.t].every((k) => k === "v" || n[k].length === 0);   // 미분·적분: 변수 칸 말고 다 비었으면 빈 상자
  return slotRows(n).every((r) => r.length === 0) || (n.t === "root" && n.body.length === 0 && n.idx.length <= 1 && (n.idx.length === 0 || n.idx[0].v === "3")); }
function backspaceCore() {
  if (cur.idx > 0) {
    const it = cur.row[cur.idx - 1];
    if (!isNode(it) || nodeIsEmpty(it) || (it.t === "func" && it.name === "rand")) {
      cur.row.splice(cur.idx - 1, 1); cur.idx--;
    } else moveLeft();                                       // 상자 안으로 들어가서 지우게
    return;
  }
  // 빈칸 맨 앞
  const p = cur.row.parent;
  if (!p) return;
  const n = p.node, owner = n.ownerRow, at = owner.indexOf(n);
  const rows = slotRows(n), k = rows.indexOf(cur.row);
  if (nodeIsEmpty(n)) { owner.splice(at, 1); cur = { row: owner, idx: at }; return; }
  if (p.key === "v" && k === 0) { cur = { row: owner, idx: at }; return; }   // d/dx 의 변수 칸 맨 앞: 상자 앞으로만 이동
  if (k > 0 && n.t !== "frac") { cur = { row: rows[k - 1], idx: rows[k - 1].length }; return; }
  // 상자 풀기: 분수는 분자 ÷ 분모, 루트·로그는 안쪽 내용만, 나머지는 내용을 이어 붙임
  let keep = rows, sep = null;
  if (n.t === "frac") sep = "÷";
  if (n.t === "func2" || n.t === "ncr" || n.t === "npr") sep = ",";
  if (n.t === "root" || n.t === "logb") keep = [rows[rows.length - 1]];
  if (n.t === "deriv" || n.t === "deriv1" || n.t === "integ" || n.t === "grad") keep = [n.body];   // 미분·적분 상자를 풀면 식만 남김
  const pieces = []; let offset = 0;
  keep.forEach((r, i) => {
    if (i > 0 && sep && r.length && pieces.length) pieces.push(mkChar(sep));
    if (r === cur.row) offset = pieces.length;
    pieces.push(...r);
  });
  owner.splice(at, 1);
  placeItems(owner, pieces, at);
  cur = { row: owner, idx: at + offset };
}

// 결과 숫자를 입력기 항목으로 (기록에서 결과를 눌렀을 때)
function numberToItems(v) {
  const f = formatNumber(v);
  const m = f.plain.match(/^(-?[\d.]+)×10\^(-?\d+)$/);
  let items;
  if (m) {
    items = [...m[1]].map(mkChar).concat([mkChar("×"), mkChar("1"), mkChar("0")]);
    const pw = mkNode("pow"); fillChars(pw.exp, m[2]); items.push(pw);
  } else items = [...f.plain].map(mkChar);
  if (v < 0) { const p = mkNode("par"); placeItems(p.body, items, 0); return [p]; }
  return items;
}

/* =====================================================================
   6. 화면 갱신
   ===================================================================== */
function refresh() {
  // --- 수식 그리기 ---
  rowRegistry = [];
  if (root.length === 0 && cur.row === root) {
    const hint = state.mode === "graph" ? "예: x², y=2x+1, x²+y²=4, y>x" : "아래 버튼으로 입력하세요. 분수, 지수 버튼을 누르면 빈칸이 생겨요";
    editorEl.innerHTML = `<span class="row" data-rid="0"><span class="m-ph on">${CURSOR}</span></span>
      <span class="hint">&nbsp; ${hint}</span>`;
    rowRegistry = [root];
  } else {
    editorEl.innerHTML = renderRow(root);
  }
  keepCursorVisible();
  // --- 그래프 모드: 식을 다시 읽고 그래프 다시 그리기 ---
  if (state.mode === "graph") {
    const f = G.fns[G.active];
    f.tree = root;
    compileFn(f);
    const rowEl = fListEl.querySelector(`.f-row[data-i="${G.active}"]`);
    if (rowEl) { rowEl.querySelector(".f-err").textContent = f.err; rowEl.querySelector(".f-y").innerHTML = yLabel(f); }
    renderLegend();
    updateGraphParams();
    scheduleDraw();
    return;
  }
  updateCalcParams();      // 계산기: 식에 쓴 문자의 값 칸
  // --- 미리 계산 (= 누르기 전, 흐리게) ---
  if (!state.justEvaluated) {
    resultEl.classList.remove("final");
    if (root.length === 0) { resultEl.innerHTML = ""; return; }
    try {
      const src = serialize(root);
      if (/rand/.test(src)) { resultEl.innerHTML = ""; return; }   // 난수는 미리 계산하지 않음
      resultEl.innerHTML = resultHTML(calculate(src));
    } catch (e) {
      resultEl.innerHTML = "";                                       // 입력 중 오류는 조용히
    }
  }
}
// 식이 길어서 옆으로 넘치면 커서가 보이게 스크롤
function keepCursorVisible() {
  const c = editorEl.querySelector(".cur");
  if (!c) return;
  const er = editorEl.getBoundingClientRect(), cr = c.getBoundingClientRect();
  if (cr.right > er.right - 12) editorEl.scrollLeft += cr.right - er.right + 24;
  else if (cr.left < er.left + 12) editorEl.scrollLeft -= er.left - cr.left + 24;
}

// 결과 줄 HTML: (분수 표시) = 값
function resultHTML(v) {
  if (v && v.vec) {                    // ∇f: (a, b, c) 와 크기 |∇f|
    const mag = Math.hypot(...v.vec);
    return `<span class="fracchip" title="벡터의 크기">|∇f| = ${formatNumber(mag).html}</span><span class="val">= (${v.vec.map((q) => formatNumber(q).html).join(", ")})</span>`;
  }
  const f = formatNumber(v);
  const fr = toFraction(v);
  const chip = fr ? `<span class="fracchip" title="분수로 나타내면">= <span class="m-frac"><span class="fn">${fr.n < 0 ? "−" : ""}${Math.abs(fr.n)}</span><span class="fd">${fr.d}</span></span></span>` : "";
  return `${chip}<span class="val">= ${f.html}</span>`;
}

/* =====================================================================
   7. = 누르기 (계산하고 기록에 저장)
   ===================================================================== */
function doEvaluate() {
  if (root.length === 0) return;
  const src = serialize(root);
  try {
    const v = calculate(src);
    state.justEvaluated = true;
    resultEl.classList.add("final");
    resultEl.innerHTML = resultHTML(v);
    if (!v.vec) {                       // 벡터(∇) 결과는 Ans 로 쓰지 않음
      state.ans = cleanNumber(v);
      $("ansInfo").innerHTML = `Ans = ${formatNumber(v).html}`;
    }
    if (state.deg && /diff|integ/.test(src) && /sin|cos|tan/.test(src)) {
      toast("지금 각도 단위가 DEG(도)예요. 미분·적분에서 삼각함수는 보통 RAD(라디안)로 계산해요", 4500);
    }
    addHistory(src, v);
  } catch (e) {
    resultEl.classList.add("final");
    const msg = e instanceof CalcError ? e.message : "계산할 수 없는 식이에요";
    resultEl.innerHTML = `<span class="err">${esc(msg)}</span>`;
  }
}

/* =====================================================================
   8. 버튼·키 동작 처리
   ===================================================================== */
/* 방금 = 을 누른 뒤 새 입력이 오면:
   - 연산자(+, ×, 분수, x² 등)로 시작 → 앞에 Ans 를 붙여 이어서 계산
   - 숫자나 함수로 시작 → 새 식 시작
   - ◀ ▶ ⌫ → 방금 식을 고쳐 쓰기 */
function startAfterResult(afterAns) {
  if (!state.justEvaluated) return;
  state.justEvaluated = false;
  root = mkRow(null);
  cur = { row: root, idx: 0 };
  if (afterAns) insertChar("Ans");
}

// 동작 이름 → 실제 동작.  post=true 면 직전 결과에 이어 붙는 동작
function act(name, post) {
  const [cmd, arg] = name.split(":");
  // 화면 조작 동작
  if (cmd === "eval" || cmd === "gnew") {
    if (state.mode === "graph") { addFn(); return; }     // 그래프에서는 = (Enter) → 새 식
    if (cmd === "eval") doEvaluate();
    return;
  }
  if (cmd === "clear") { state.justEvaluated = false; root = mkRow(null); cur = { row: root, idx: 0 }; refresh(); return; }
  if (cmd === "deg") { toggleDeg(); return; }
  if (cmd === "wrap") { state.justEvaluated = false; }
  if (["left", "right", "up", "down", "back", "home", "end"].includes(cmd)) {
    if (state.justEvaluated) { state.justEvaluated = false; }
    if (cmd === "left") moveLeft();
    if (cmd === "right") moveRight();
    // 위/아래: 분수 안이면 분자↔분모, 그래프에서는 그 밖이면 위/아래 식으로
    if (cmd === "up" && !moveVertical(-1) && state.mode === "graph" && G.active > 0) { activateFn(G.active - 1); return; }
    if (cmd === "down" && !moveVertical(1) && state.mode === "graph" && G.active < G.fns.length - 1) { activateFn(G.active + 1); return; }
    if (cmd === "back") backspaceCore();
    if (cmd === "home") cur = { row: root, idx: 0 };
    if (cmd === "end") cur = { row: root, idx: root.length };
    refresh(); return;
  }
  // 입력 동작
  startAfterResult(post);
  if (cmd !== "ch" || !/^[A-Za-z]$/.test(arg)) {
    // 함수 이름을 치다가 다른 걸 누르면 함수로 바꿔 줌 (예: sin 다음 3 → sin(3))
    const made = convertName(true);
    if (made === "node" && cmd === "par") {                          // sin( 의 ( 는 이미 들어감
      cur.row.parent.node.implicit = false; refresh(); return;
    }
    // log 처럼 바로 바뀐 함수 다음에 ( 를 치면 괄호를 또 만들지 않음
    if (cmd === "par" && cur.row.parent && cur.row.parent.node.implicit && cur.row.length === 0) {
      cur.row.parent.node.implicit = false; refresh(); return;
    }
  }
  // d/dx 의 x 같은 변수 칸: 문자 하나만 들어감 (문자를 누르면 그 문자로 바뀜, x → y)
  if (cur.row.parent && cur.row.parent.key === "v") {
    if ((cmd === "ch" || cmd === "lt") && /^[a-z]$/.test(arg) && arg !== "e") {
      cur.row.splice(0, cur.row.length);
      placeItems(cur.row, [Object.assign(mkChar(arg), { lit: true })], 0);
      cur.idx = 1;
    } else toast("이 칸에는 미분·적분할 변수(문자 하나)를 넣어요. 예: x, y, t");
    refresh(); return;
  }
  switch (cmd) {
    case "lt":       // 문자 키로 넣은 계수·상수 (함수 이름으로 바뀌지 않음)
      insertItems([Object.assign(mkChar(arg), { lit: true })]);
      break;
    case "ch":
      // 값이 두 개인 상자(nCr, mod 등)의 첫 빈칸에서 쉼표 → 다음 빈칸으로 이동
      if (arg === "," && cur.row.parent) {
        const n = cur.row.parent.node, rows = slotRows(n), k = rows.indexOf(cur.row);
        if (rows.length > 1 && k < rows.length - 1 && n.t !== "frac") { cur = { row: rows[k + 1], idx: 0 }; break; }
      }
      if (arg === "x" || arg === "y") convertName(true);   // sin 다음에 x → sin(x),  ln 다음에 x → ln(x)
      if (REL.includes(arg)) {
        // 등호·부등호는 맨 바깥에만: 분수나 괄호 안에 있으면 밖으로 나와서 넣기
        while (cur.row.parent) exitNode();
        // < 다음 = → ≤,  > 다음 = → ≥  (키보드로 <= 처럼 칠 때)
        const prev = cur.row[cur.idx - 1];
        if (arg === "=" && prev && !isNode(prev) && (prev.v === "<" || prev.v === ">")) {
          prev.v = prev.v === "<" ? "≤" : "≥"; break;
        }
      }
      insertChar(arg); if (/^[A-Za-z]$/.test(arg)) convertName(false); break;
    case "frac": insertFraction(); break;
    case "pow": insertPower(arg); break;
    case "sqrt": insertNode(mkNode("sqrt")); break;
    case "cbrt": { const n = mkNode("root"); fillChars(n.idx, "3"); insertNode(n, "body"); break; }
    case "root": insertNode(mkNode("root")); break;
    case "par": insertNode(mkNode("par")); break;
    case "exit": if (!exitParen()) toast("닫을 괄호가 없어요"); break;
    case "wrap": wrapParen(); break;                         // 괄호 씌우기
    case "func": if (arg === "rand") { insertItems([mkNode("func", { name: "rand" })]); } else insertNode(mkNode("func", { name: arg })); break;
    case "func2": insertNode(mkNode("func2", { name: arg })); break;
    case "logb": insertNode(mkNode("logb")); break;
    case "ncr": insertNode(mkNode("ncr")); break;
    case "npr": insertNode(mkNode("npr")); break;
    case "abs": insertNode(mkNode("abs")); break;
    case "deriv": insertNode(mkNode("deriv"), "body"); break;     // 미분계수: 식 칸부터
    case "deriv1": insertNode(mkNode("deriv1"), "body"); break;   // 도함수: 식 칸부터
    case "grad": insertNode(mkNode("grad")); break;               // 그래디언트: 식 칸부터
    case "integ": insertNode(mkNode("integ")); break;      // 정적분: 아래끝 칸부터
    case "tenpow": insertChar("1"); insertChar("0"); insertPower(); break;    // 10ˣ
    case "epow": insertChar("e"); insertPower(); break;                       // eˣ
    case "sci": insertChar("×"); insertChar("1"); insertChar("0"); insertPower(); break;  // ×10ⁿ
  }
  refresh();
}

// 지금 화면(계산기/그래프)의 각도 단위
function angleDeg() { return state.mode === "graph" ? G.deg : state.deg; }
// DEG/RAD 표시를 모두 맞추기
function updateDegLabels() {
  $("modeBadge").textContent = state.deg ? "DEG" : "RAD";
  document.querySelectorAll('[data-act="deg"]').forEach((b) => (b.textContent = angleDeg() ? "DEG" : "RAD"));
  $("gDegBtn").textContent = G.deg ? "DEG" : "RAD";
}
function toggleDeg() {
  if (state.mode === "graph") {                // 그래프는 각도 단위를 따로 가짐 (기본 RAD)
    G.deg = !G.deg;
    G.fns.forEach((f) => compileFn(f));        // 각도 단위가 바뀌면 정적분 값·기울기도 다시 계산
    renderFnList();
    updateDegLabels();
    toast(G.deg ? "그래프 각도 단위: 도(°)" : "그래프 각도 단위: 라디안(rad)");
    scheduleDraw();
    return;
  }
  state.deg = !state.deg;
  updateDegLabels();
  toast(state.deg ? "각도 단위: 도(°)" : "각도 단위: 라디안(rad)");
  if (state.justEvaluated) doEvaluate(); else refresh();   // 바뀐 단위로 다시 계산
}

/* 키보드 글자 하나 → 동작 (노트북 키보드, 휴대폰 자판, 붙여넣기 공통) */
function typeChar(ch) {
  if (/\s/.test(ch)) return;
  if (/[0-9.]/.test(ch)) return act("ch:" + ch, false);
  if (/[A-Za-z]/.test(ch)) return act("ch:" + ch, false);
  const map = {
    "+": ["ch:+", true], "-": ["ch:-", true], "−": ["ch:-", true], "*": ["ch:×", true], "×": ["ch:×", true],
    "÷": ["ch:÷", true], "/": ["frac", true], "^": ["pow", true], "(": ["par", false], ")": ["exit", false],
    "[": ["par", false], "]": ["exit", false], ",": ["ch:,", false], "!": ["ch:!", true], "%": ["ch:%", true],
    "π": ["ch:π", false], "²": ["pow:2", true], "³": ["pow:3", true], "√": ["sqrt", false], "∛": ["cbrt", false],
  };
  if (state.mode === "graph") Object.assign(map, { "=": ["ch:=", false], "<": ["ch:<", false], ">": ["ch:>", false], "≤": ["ch:≤", false], "≥": ["ch:≥", false] });
  if (!map[ch]) return;
  if ("+-−*×÷,/".includes(ch) && !state.justEvaluated) {   // 1/2/2 = (1/2)÷2 처럼 한 줄 수식 규칙
    convertName(true);              // sqrt 처럼 치던 이름이 있으면 먼저 함수로
    autoExitForTyping();
  }
  act(map[ch][0], map[ch][1]);
}

// 버튼 하나 만들기
function makeKey(k0, group) {
  const k = state.mode === "graph" && k0.g ? Object.assign({}, k0, k0.g) : k0;   // 그래프용 모양이 있으면 그것으로
  const b = document.createElement("button");
  b.type = "button";
  b.className = `key ${k.c} ${k.sz || ""}`;
  b.dataset.group = group;
  b.dataset.act = k.a;
  b.innerHTML = k.a === "deg" ? (angleDeg() ? "DEG" : "RAD") : `<span class="kl">${k.l}</span>`;
  b.setAttribute("aria-label", k.t || b.textContent);
  if (k.t) b.title = k.t;
  b._key = k;
  return b;
}
// 탭 버튼
function buildTabs() {
  Object.entries(FUNC_TABS).forEach(([id, tab]) => {
    const t = document.createElement("button");
    t.type = "button"; t.className = "tab"; t.textContent = tab.name; t.dataset.tab = id;
    t.setAttribute("role", "tab");
    t.addEventListener("mousedown", (e) => e.preventDefault());       // 입력칸 초점 유지
    t.addEventListener("click", () => {
      if (state.mode === "graph" && isNarrow()) {
        // 휴대폰 그래프: 접혀 있으면 펼치고, 펼친 탭을 다시 누르면 접음 (그래프를 크게 보기)
        if (G.fold) { setFold(false); state.tab = id; }
        else if (state.tab === id) setFold(true);
        else state.tab = id;
      } else state.tab = id;
      renderFuncKeys();
    });
    tabsEl.appendChild(t);
  });
}
// 함수 탭 내용 (탭을 바꾸면 이 15개만 새로 그림)
function renderFuncKeys() {
  keysEl.querySelectorAll('[data-group="fn"]').forEach((b) => b.remove());
  const anchor = keysEl.querySelector('[data-group="pin"]');
  FUNC_TABS[state.tab].keys.forEach((k) => keysEl.insertBefore(makeKey(k, "fn"), anchor));
  tabsEl.querySelectorAll(".tab").forEach((t) => {
    const tab = FUNC_TABS[t.dataset.tab];
    t.style.display = tab.graphOnly && state.mode !== "graph" ? "none" : "";   // 그래프 전용 탭
    t.textContent = state.mode === "graph" && tab.short ? tab.short : tab.name; // 그래프에서는 탭이 5개라 짧은 이름
    t.classList.toggle("on", t.dataset.tab === state.tab && !(state.mode === "graph" && G.fold && isNarrow()));
    t.setAttribute("aria-selected", t.dataset.tab === state.tab);
  });
}
function buildKeys() {
  buildTabs();
  rebuildKeys();
}
// 버튼 다시 만들기 (계산기 ↔ 그래프 전환 때)
function rebuildKeys() {
  keysEl.querySelectorAll(".key").forEach((b) => b.remove());
  PIN_KEYS.forEach((k) => keysEl.appendChild(makeKey(k, "pin")));
  CTRL_KEYS.forEach((k) => keysEl.appendChild(makeKey(k, "ctl")));
  NUM_KEYS.forEach((k) => keysEl.appendChild(makeKey(k, "num")));
  renderFuncKeys();
}

let repeatTimer = null, repeatDelay = null;
function stopRepeat() { clearTimeout(repeatDelay); clearInterval(repeatTimer); repeatDelay = repeatTimer = null; }
keysEl.addEventListener("mousedown", (e) => { if (e.target.closest(".key")) e.preventDefault(); }); // 입력칸 초점 유지
keysEl.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".key");
  if (!b || b.dataset.act !== "back") return;
  // ⌫ 는 누르고 있으면 계속 지우기
  e.preventDefault();
  b.classList.add("pressed");
  act("back");
  repeatDelay = setTimeout(() => { repeatTimer = setInterval(() => act("back"), 70); }, 450);
});
["pointerup", "pointerleave", "pointercancel"].forEach((ev) =>
  keysEl.addEventListener(ev, () => { stopRepeat(); keysEl.querySelectorAll(".pressed").forEach((b) => b.classList.remove("pressed")); }));
keysEl.addEventListener("click", (e) => {
  const b = e.target.closest(".key");
  if (!b) return;
  if (b.dataset.act === "back" && e.detail !== 0) return;  // ⌫ 는 pointerdown 에서 이미 처리
  act(b._key.a, !!b._key.post);
  if (state.nativeKbd) $("kbdSink").focus();
});

/* =====================================================================
   10. 입력칸을 눌러서 커서 옮기기 + 키보드 입력
   ===================================================================== */
editorEl.addEventListener("pointerdown", (e) => {
  state.justEvaluated = false;
  const el = e.target.closest("[data-i],[data-rid]");
  if (!el || !editorEl.contains(el)) {
    // 빈 곳을 누르면 맨 끝으로
    cur = { row: root, idx: root.length };
  } else if (el.dataset.i !== undefined) {
    // 글자(또는 상자 테두리)를 누르면 그 글자의 왼쪽/오른쪽 절반에 따라 앞/뒤에 커서
    const row = rowRegistry[+el.dataset.rid], i = +el.dataset.i;
    const r = el.getBoundingClientRect();
    cur = { row, idx: e.clientX < r.left + r.width / 2 ? i : i + 1 };
  } else {
    // 빈칸이나 줄의 여백을 누르면: 그 줄에서 가장 가까운 자리
    const row = rowRegistry[+el.dataset.rid];
    const items = [...el.children].filter((c) => c.dataset.i !== undefined);
    let idx = 0;
    items.forEach((c) => { const r = c.getBoundingClientRect(); if (e.clientX > r.left + r.width / 2) idx = +c.dataset.i + 1; });
    cur = { row, idx: Math.min(idx, row.length) };
  }
  refresh();
  if (state.nativeKbd) { e.preventDefault(); $("kbdSink").focus(); }
});

// 키보드 (노트북): 입력칸이 아니라 문서 전체에서 받음 → 어디를 눌렀든 바로 타자 가능
document.addEventListener("keydown", (e) => {
  const tag = e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;              // 숨은 자판 칸은 따로 처리
  if (e.target.closest && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;                 // 복사·붙여넣기 등은 브라우저에 맡김
  const keyMap = {
    Enter: "eval", "=": "eval", Escape: "clear", Backspace: "back", ArrowLeft: "left", ArrowRight: "right",
    ArrowUp: "up", ArrowDown: "down", Home: "home", End: "end",
  };
  if (state.mode === "graph" && "=<>".includes(e.key)) { e.preventDefault(); typeChar(e.key); return; }   // 그래프: 등호·부등호 입력
  if (keyMap[e.key]) { e.preventDefault(); act(keyMap[e.key]); return; }
  if (e.key === "Delete") { e.preventDefault(); if (moveRight()) backspaceCore(); refresh(); return; }
  if (e.key.length === 1) { e.preventDefault(); typeChar(e.key); }
});
// 붙여넣기: 글자를 하나씩 친 것처럼 (/ 는 분수, ^ 는 지수로 바뀜)
document.addEventListener("paste", (e) => {
  if (e.target.tagName === "INPUT") return;
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (!text) return;
  e.preventDefault();
  [...text].forEach(typeChar);
});
// 복사: 지금 식을 글자 수식으로
document.addEventListener("copy", (e) => {
  if (e.target.tagName === "INPUT" || String(window.getSelection())) return;
  if (!root.length) return;
  e.preventDefault();
  e.clipboardData.setData("text/plain", serialize(root));
  toast("수식을 글자로 복사했어요");
});

/* 휴대폰: 기본은 계산기 버튼만 사용(자판 안 뜸). '자판 입력'을 켜면 숨은 칸으로 글자를 받아 넣음 */

function addHistory(src, v) {
  const f = v.vec
    ? { plain: `(${v.vec.map((q) => formatNumber(q).plain).join(", ")})`, insert: null, html: `(${v.vec.map((q) => formatNumber(q).html).join(", ")})` }
    : formatNumber(v);
  // 식에 쓴 문자와 그 값 (예: m = 2, v = 3)
  let used = [];
  try { used = [...freeVars(new Parser(tokenize(src), false).parseAll())].sort(); } catch (e) { used = []; }
  const entry = {
    params: used.map((n) => `${n} = ${paramText(PV[n])}`).join(", "),
    no: ++historyNo,
    time: new Date(),
    expr: src,
    value: v.vec ? null : cleanNumber(v),
    resultText: f.plain,
    insert: f.insert,
    html: f.html,
    mode: state.deg ? "DEG" : "RAD",
    tree: cloneRow(root, null),       // 교과서 모양 그대로 다시 불러오기 위해 식 구조도 저장
  };
  history.push(entry);
  renderHistory();
  saveToServer(entry);
}

/* 나중에 구글 앱스스크립트 웹앱에 넣을 때 기록을 스프레드시트로 보내는 자리.
   지금(깃허브/오프라인)은 google.script 가 없으므로 아무 일도 하지 않음.
   앱스스크립트 쪽 예시 (Code.gs):
     function saveCalcRecord(r) {
       const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('계산기록')
              || SpreadsheetApp.getActiveSpreadsheet().insertSheet('계산기록');
       sh.appendRow([new Date(), r.expr, r.result, r.mode]);
     }                                                                          */
function saveToServer(entry) {
  if (typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run.withFailureHandler(() => {}).saveCalcRecord({
      expr: entry.expr, result: entry.resultText, mode: entry.mode, params: entry.params,
    });
  }
}

function timeStr(d) { return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }

  }).join("");
}
