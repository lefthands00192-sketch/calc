/* =====================================================================
   15. 그래프
   - 함수 y = f(x) 를 최대 6개까지 색을 달리해 그림
   - 식 입력은 계산기와 같은 교과서식 입력기를 그대로 사용 (변수 x 추가)
   - 끌어서 이동, 두 손가락·휠·버튼으로 확대/축소, 곡선을 누르면 좌표 표시
   ===================================================================== */
const PALETTE = ["#e03131", "#1c7ed6", "#2f9e44", "#f08c00", "#9c36b5", "#0c8599"];  // 함수 색
const G = {
  fns: [],          // 함수 목록 { id, color, tree(식 구조), visible, ast(계산용 구조), err }
  active: 0,        // 지금 입력 중인 함수 번호
  cx: 0, cy: 0,     // 화면 가운데의 좌표
  ppu: 0,           // 1 단위가 몇 픽셀인지 (확대 정도)
  deg: false,       // 그래프의 각도 단위 (기본: 라디안)
  piTicks: false,   // x축 눈금을 π 단위로
  trace: null,      // 좌표를 보여 줄 점 { id(함수), x }
  kbdHidden: false, // 휴대폰에서 키패드 숨김
  fold: undefined,  // 휴대폰에서 함수 키 줄 접음
  tanOn: false,     // 좌표를 볼 때 접선도 보여 주기
};
let fnSeq = 0;
let calcSaved = null;              // 그래프로 넘어갈 때 계산기 식을 보관
const appEl = document.querySelector(".app");
const graphEl = $("graph"), canvas = $("gCanvas"), fListEl = $("fList");
state.mode = "calc";

/* ---------- 함수 목록 ---------- */
function newFn() {
  const used = G.fns.map((f) => f.color);
  const color = PALETTE.find((c) => !used.includes(c)) || PALETTE[fnSeq % PALETTE.length];
  return { id: ++fnSeq, color, tree: mkRow(null), visible: true, ast: null, err: "" };
}

/* ---------- 식 해석: 등호·부등호로 나누고 그래프 종류 정하기 ----------
   종류(kind)
   - yfx : y = (x 식)  … 등호가 없으면 이것으로 봄 (예: x²  →  y = x²)
   - xfy : x = (y 식)  … 세로선 x = 3, 옆으로 누운 포물선 x = y²
   - imp : 그 밖의 x, y 식 (원 x²+y²=4 등) → 왼쪽 − 오른쪽 = 0 인 곳을 찾아 그림
   부등호(< > ≤ ≥)면 영역을 색칠하고, < > 는 경계선을 점선으로 그림 */
const FLIP = { "=": "=", "<": ">", ">": "<", "≤": "≥", "≥": "≤" };     // 양쪽을 바꿀 때 부등호 방향
// y = f(x) 꼴로 그리는 종류들 (area: 정적분 넓이, tangent: 접선)
const isYK = (k) => k === "yfx" || k === "area" || k === "tangent";
/* 식 전체가 정적분 하나(끝값에 x 없음) → 곡선 + 그 구간 넓이 색칠
   식 전체가 미분계수 하나(x = 값)      → 곡선 + 그 점의 접선 */
function compileSpecial(f, n) {
  if (varText(n) !== "x") return false;            // 변수가 x 가 아니면(예: dt) 보통 식으로 그림
  const body = parsePart(n.body);
  if (usesVar(body, "y")) return false;
  useParams(f, body);
  const ctx = { deg: G.deg, ans: state.ans, _p: PV, graph: true };
  const F = (t) => evaluate(body, Object.assign({}, ctx, { x: t }));
  if (n.t === "integ") {
    const lo = parsePart(n.lo), hi = parsePart(n.hi);
    if ([lo, hi].some((q) => usesVar(q, "x") || usesVar(q, "y"))) return false;   // 끝값에 x 가 있으면 보통 식(적분함수)으로
    useParams(f, lo); useParams(f, hi);
    const a = evaluate(lo, ctx), b = evaluate(hi, ctx);
    f.kind = "area"; f.ast = body; f.area = { a, b, value: numInteg(F, a, b) };
    return true;
  }
  const at = parsePart(n.at);
  if (usesVar(at, "x") || usesVar(at, "y")) return false;
  useParams(f, at);
  const a = evaluate(at, ctx);
  const fa = F(a);
  if (!Number.isFinite(fa)) throw new CalcError("이 점에서는 함수값이 없어요");
  f.kind = "tangent"; f.ast = body; f.tan = { a, fa, m: numDiff(F, a) };
  return true;
}
// 식에 쓴 문자(x, y 말고)를 모으고, 처음 보는 문자는 값 1 로 시작
function useParams(f, ast) {
  freeVars(ast).forEach((n) => {
    if (n === "x" || n === "y") return;
    f.params.add(n);
    ensureParam(n, 1);
  });
}
// 미분 상자 안에 y 가 있는지 (d/dx 안의 y 는 상수로 계산됨을 알려 주려고)
function derivHasY(row) {
  return row.some((it) => isNode(it) && (((it.t === "deriv" || it.t === "deriv1") && !hasLetter(it.v, "y") && hasVarY(it.body)) || slotRows(it).some(derivHasY)));
}
// 상자(분수, 괄호 등) 안에 등호·부등호가 있는지
function relInside(row) {
  return row.some((it) => isNode(it) && slotRows(it).some((r) => r.some(isRel) || relInside(r)));
}
// 계산용 구조 안에 변수(x 또는 y)가 쓰였는지
function usesVar(node, name) {
  if (!node || typeof node !== "object") return false;
  if (node.type === "var") return node.name === name;
  return Object.values(node).some((v) =>
    Array.isArray(v) ? v.some((c) => usesVar(c, name)) : (v && typeof v === "object" && v.type ? usesVar(v, name) : false));
}
// 줄 하나(등호 한쪽)를 계산용 구조로
function parsePart(row) {
  const src = serialize(row);
  const ast = new Parser(tokenize(src), false).parseAll();
  if (src.includes("□")) throw new CalcError("빈칸(□)을 채우면 그래프가 그려져요");
  return ast;
}
const isSingle = (row, v) => row.length === 1 && !isNode(row[0]) && row[0].v === v;

function compileFn(f) {
  f.ast = null; f.err = ""; f.kind = null; f.op = "="; f.params = new Set();
  const t = f.tree;
  f.hasRel = t.some(isRel);            // 등호가 없으면 줄 앞에 흐리게 "y =" 를 보여 줌
  if (!t.length) return;
  try {
    if (relInside(t)) throw new CalcError("등호·부등호는 괄호나 분수 밖에 써 주세요");
    const at = t.map((it, i) => (isRel(it) ? i : -1)).filter((i) => i >= 0);
    if (at.length > 1) throw new CalcError("등호·부등호는 한 번만 쓸 수 있어요");
    if (at.length === 0) {                                   // 등호 없음 → y = (식)
      if (t.length === 1 && (t[0].t === "integ" || t[0].t === "deriv") && compileSpecial(f, t[0])) return;
      const ast = parsePart(t);
      if (usesVar(ast, "y")) throw new CalcError("y 가 들어 있으면 등호(=)나 부등호를 넣어 주세요");
      useParams(f, ast);
      f.kind = "yfx"; f.ast = ast; return;
    }
    const k = at[0], op = t[k].v;
    const L = t.slice(0, k), R = t.slice(k + 1);
    if (!L.length || !R.length) throw new CalcError(`${op} 양쪽에 식을 써 주세요`);
    const pl = parsePart(L), pr = parsePart(R);
    if (![pl, pr].some((a) => usesVar(a, "x") || usesVar(a, "y"))) throw new CalcError("x 나 y 가 들어간 식을 써 주세요");
    useParams(f, pl); useParams(f, pr);
    f.op = op;
    if (isSingle(L, "y") && !usesVar(pr, "y")) { f.kind = "yfx"; f.ast = pr; }
    else if (isSingle(R, "y") && !usesVar(pl, "y")) { f.kind = "yfx"; f.ast = pl; f.op = FLIP[op]; }
    else if (isSingle(L, "x") && !usesVar(pr, "x")) { f.kind = "xfy"; f.ast = pr; }
    else if (isSingle(R, "x") && !usesVar(pl, "x")) { f.kind = "xfy"; f.ast = pl; f.op = FLIP[op]; }
    else { f.kind = "imp"; f.ast = { type: "bin", op: "-", l: pl, r: pr }; }   // 왼쪽 − 오른쪽
    if (derivHasY(t)) f.err = "참고: d/dx 안의 y 는 상수로 보고 계산했어요 (편미분)";
  } catch (e) {
    f.ast = null; f.kind = null;
    f.err = e instanceof CalcError ? e.message : "식 모양이 올바르지 않아요";
  }
}
// (x, y) 에서 식의 값 (정의되지 않으면 NaN)
function evalXY(ast, x, y) {
  try {
    const v = evaluate(ast, { deg: G.deg, ans: state.ans, x, y, _p: PV, graph: true });
    return Number.isFinite(v) ? v : NaN;
  } catch (e) { return NaN; }
}

// 줄 앞 표시: 등호 없이 x 식만 쓰면 "y =" 를 흐리게 보여 줌 (y = 그 식으로 그린다는 뜻)
function yLabel(f) {
  if (f.kind === "area" || f.kind === "tangent") return "";             // 넓이·접선 식은 "y =" 없이
  return f.tree.length && !f.hasRel && !hasVarY(f.tree) ? "<i>y</i> =" : "";
}
// 줄 안 어디에든 y 가 있는지 (상자 안까지)
function hasVarY(row) { return row.some((it) => (isNode(it) ? slotRows(it).some(hasVarY) : it.v === "y")); }
// 함수 목록 그리기 (입력 중인 줄에는 입력칸을 옮겨 넣음)
function renderFnList() {
  fListEl.innerHTML = "";
  G.fns.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "f-row" + (i === G.active ? " on" : "");
    row.dataset.i = i;
    row.style.setProperty("--c", f.color);
    row.innerHTML = `<button class="f-dot${f.visible ? "" : " off"}" type="button" data-f="vis" title="그래프 보이기/숨기기" aria-label="그래프 보이기/숨기기"></button>
      <span class="f-y">${yLabel(f)}</span>
      <div class="f-expr"></div>
      <button class="f-del" type="button" data-f="del" title="이 식 지우기" aria-label="이 식 지우기">×</button>
      <div class="f-err">${esc(f.err)}</div>`;
    const ex = row.querySelector(".f-expr");
    if (i === G.active) ex.appendChild(editorEl);
    else ex.innerHTML = f.tree.length ? renderStatic(f.tree) : '<span class="f-empty">눌러서 식 입력</span>';
    fListEl.appendChild(row);
  });
  // 입력 중인 줄이 목록 안에서 보이도록 스크롤
  const on = fListEl.querySelector(".f-row.on");
  if (on) {
    if (on.offsetTop < fListEl.scrollTop) fListEl.scrollTop = on.offsetTop - 3;
    else if (on.offsetTop + on.offsetHeight > fListEl.scrollTop + fListEl.clientHeight) fListEl.scrollTop = on.offsetTop + on.offsetHeight - fListEl.clientHeight + 3;
  }
  $("btnAddFn").disabled = G.fns.length >= PALETTE.length;
  renderLegend();
}
// 휴대폰에서는 입력 중인 식 한 줄만 보이므로, 모든 식을 그래프 왼쪽 위에 작게 보여 줌 (누르면 그 식 고치기)
const legendEl = $("gLegend");
function renderLegend() {
  const items = G.fns.map((f, i) => ({ f, i })).filter(({ f }) => f.tree.length);
  legendEl.hidden = items.length < 2;
  legendEl.innerHTML = legendEl.hidden ? "" : items.map(({ f, i }) =>
    `<button type="button" class="g-leg${i === G.active ? " on" : ""}${f.visible ? "" : " off"}" data-i="${i}" style="--c:${f.color}">` +
    `<i></i><span class="tx">${yLabel(f) ? "<em>y</em> = " : ""}${renderStatic(f.tree)}</span></button>`).join("");
}
legendEl.addEventListener("mousedown", (e) => e.preventDefault());
legendEl.addEventListener("click", (e) => {
  const b = e.target.closest(".g-leg");
  if (!b) return;
  if (+b.dataset.i !== G.active) activateFn(+b.dataset.i);
  if (G.kbdHidden) setKbdHidden(false);
});
// 휴대폰 그래프: 함수 키 3줄 접기/펴기
function isNarrow() { return window.matchMedia("(max-width: 899.98px)").matches; }
function setFold(v) { G.fold = v; appEl.classList.toggle("fn-fold", v); }

// 다른 함수 줄로 옮겨 가서 입력하기
function activateFn(i) {
  G.fns[G.active].tree = root;
  G.active = i;
  root = G.fns[i].tree;
  cur = { row: root, idx: root.length };
  renderFnList();
  refresh();
}
// 새 식 추가 (빈 줄이 있으면 그 줄로)
function addFn() {
  G.fns[G.active].tree = root;
  const empty = G.fns.findIndex((f) => f.tree.length === 0);
  if (empty >= 0) { activateFn(empty); return; }
  if (G.fns.length >= PALETTE.length) { toast(`식은 ${PALETTE.length}개까지 그릴 수 있어요`); return; }
  G.fns.push(newFn());
  activateFn(G.fns.length - 1);
  fListEl.scrollTop = fListEl.scrollHeight;
}
// 식 지우기 (하나만 남았으면 내용만 비움)
function deleteFn(i) {
  G.fns[G.active].tree = root;
  if (G.trace && G.trace.id === G.fns[i].id) G.trace = null;
  if (G.fns.length === 1) {
    G.fns[0].tree = mkRow(null);
  } else {
    G.fns.splice(i, 1);
    if (G.active > i || G.active >= G.fns.length) G.active = Math.max(0, G.active - 1);
  }
  root = G.fns[G.active].tree;
  cur = { row: root, idx: root.length };
  renderFnList();
  refresh();
}

fListEl.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
fListEl.addEventListener("click", (e) => {
  const rowEl = e.target.closest(".f-row");
  if (!rowEl) return;
  const i = +rowEl.dataset.i, btn = e.target.closest("button[data-f]");
  if (btn && btn.dataset.f === "vis") { G.fns[i].visible = !G.fns[i].visible; renderFnList(); scheduleDraw(); return; }
  if (btn && btn.dataset.f === "del") { deleteFn(i); return; }
  if (i !== G.active) activateFn(i);
  if (G.kbdHidden) setKbdHidden(false);          // 식을 누르면 키패드 다시 보이기
});
$("btnAddFn").addEventListener("click", () => act("gnew"));
$("btnAddFn").addEventListener("mousedown", (e) => e.preventDefault());

// 휴대폰: 그래프를 크게 보려고 키패드 숨기기
function setKbdHidden(h) {
  G.kbdHidden = h;
  appEl.classList.toggle("kbd-hidden", h);
  $("btnKeysToggle").textContent = h ? "키패드 ▴" : "키패드 ▾";
}
$("btnKeysToggle").addEventListener("click", () => setKbdHidden(!G.kbdHidden));

/* ---------- 계산기 ↔ 그래프 전환 ---------- */
function setMode(m) {
  if (state.mode === m) return;
  // 문자 값 칸에 초점이 남아 있으면 풀기 (안 보이는 칸으로 키보드 글자가 들어가지 않게)
  if (document.activeElement && document.activeElement.classList.contains("p-val")) document.activeElement.blur();
  if (m === "graph") {
    calcSaved = { root, cur };
    state.justEvaluated = false;
    closeHistorySheet();
    if (!G.fns.length) G.fns.push(newFn());
    state.mode = "graph";
    root = G.fns[G.active].tree;
    cur = { row: root, idx: root.length };
  } else {
    G.fns[G.active].tree = root;
    state.mode = "calc";
    root = calcSaved.root; cur = calcSaved.cur;
    resultEl.parentNode.insertBefore(editorEl, resultEl);      // 입력칸을 계산 화면으로 되돌리기
  }
  appEl.dataset.mode = m;
  document.querySelectorAll(".mode-seg button").forEach((b) => {
    b.classList.toggle("on", b.dataset.mode === m);
    b.setAttribute("aria-selected", b.dataset.mode === m);
  });
  // 그래프에 들어가면 '부등호' 탭(x, y, =)을 먼저, 계산기로 오면 '기본 함수' 탭
  if (m === "graph") {
    state.tab = "rel";
    if (G.fold === undefined) setFold(window.innerHeight < 760);   // 처음 들어올 때: 세로가 짧은 휴대폰이면 함수 줄을 접어 둠
  }
  else if (FUNC_TABS[state.tab].graphOnly) state.tab = "basic";
  rebuildKeys();        // = 키 → '+ 식', π 키 → x 키, Ans 키 → y 키, ×10ⁿ 키 → = 키
  updateDegLabels();
  if (m === "graph") { G.fns.forEach((f) => { if (f !== G.fns[G.active]) compileFn(f); }); renderFnList(); }
  refresh();
  if (m === "graph") resizeCanvas();
}
document.querySelectorAll(".mode-seg button").forEach((b) => {
  b.addEventListener("mousedown", (e) => e.preventDefault());
  b.addEventListener("click", () => setMode(b.dataset.mode));
});

/* ---------- 좌표 변환 (수학 좌표 ↔ 화면 픽셀) ---------- */
let gW = 0, gH = 0, dpr = 1;
const toPx = (x) => gW / 2 + (x - G.cx) * G.ppu;
const toPy = (y) => gH / 2 - (y - G.cy) * G.ppu;
const fromPx = (px) => G.cx + (px - gW / 2) / G.ppu;
const fromPy = (py) => G.cy - (py - gH / 2) / G.ppu;
const clampPpu = (v) => Math.min(1e7, Math.max(1e-6, v));

// 그리는 영역 크기가 바뀌면 캔버스 해상도 맞추기 (선명하게)
function resizeCanvas() {
  const r = graphEl.getBoundingClientRect();
  if (!r.width || !r.height) return;
  dpr = window.devicePixelRatio || 1;
  gW = r.width; gH = r.height;
  canvas.width = Math.round(gW * dpr);
  canvas.height = Math.round(gH * dpr);
  if (!G.ppu) homeView();
  draw();
}
if (window.ResizeObserver) new ResizeObserver(() => { if (state.mode === "graph") resizeCanvas(); }).observe(graphEl);
window.addEventListener("resize", () => { if (state.mode === "graph") resizeCanvas(); });

// 처음 화면: 원점이 가운데, x 는 대략 -10 ~ 10
function homeView() {
  G.cx = 0; G.cy = 0;
  G.ppu = Math.max(4, Math.min(gW / 20, gH / 12));
  scheduleDraw();
}
// (px, py) 지점을 중심으로 k 배 확대
function zoomAt(px, py, k) {
  const wx = fromPx(px), wy = fromPy(py);
  G.ppu = clampPpu(G.ppu * k);
  G.cx = wx - (px - gW / 2) / G.ppu;
  G.cy = wy + (py - gH / 2) / G.ppu;
  scheduleDraw();
}

/* ---------- 눈금 간격과 글자 ---------- */
// 보기 좋은 간격 (1, 2, 5, 10, 20, 50 …)
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  const n = m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10;
  return { step: n * p, minor: n === 2 ? (n * p) / 4 : (n * p) / 5 };
}
// π 단위 간격 (π/12, π/6, π/4, π/2, π, 2π …)
function piStep(raw) {
  const ks = [1 / 12, 1 / 6, 1 / 4, 1 / 2, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024];
  const k = ks.find((q) => q * Math.PI >= raw) || ks[ks.length - 1];
  return { step: k * Math.PI, minor: (k * Math.PI) / 2 };
}
const SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };
const toSup = (s) => String(s).split("").map((c) => SUP[c] || c).join("");
// 눈금 숫자 글자
function tickLabel(v, step) {
  if (Math.abs(v) < Math.abs(step) * 1e-6) return "0";
  const a = Math.abs(step);
  if (a >= 1e6 || a < 1e-4) {
    const e = Math.floor(Math.log10(Math.abs(v)));
    const m = Number((v / Math.pow(10, e)).toPrecision(3));
    return `${m === 1 ? "" : m === -1 ? "−" : String(m).replace("-", "−") + "×"}10${toSup(e)}`;
  }
  const dec = Math.max(0, -Math.floor(Math.log10(a) + 1e-9));
  return v.toFixed(dec).replace("-", "−");
}
// π 눈금 글자 (예: π/2, 3π/4, −2π)
function piLabel(v) {
  const f = v / Math.PI;
  for (const d of [1, 2, 3, 4, 6, 12]) {
    const n = Math.round(f * d);
    if (Math.abs(f * d - n) < 1e-6) {
      const g = gcd2(n, d), nn = n / g, dd = d / g;
      if (nn === 0) return "0";
      const sign = nn < 0 ? "−" : "", an = Math.abs(nn);
      return `${sign}${an === 1 ? "" : an}π${dd > 1 ? "/" + dd : ""}`;
    }
  }
  return tickLabel(v, 0.1);
}
// 좌표값 글자 (추적 점 표시용, 5자리)
function coordText(v) {
  if (!Number.isFinite(v)) return "정의되지 않음";
  if (Math.abs(v) < 1e-10) return "0";
  const a = Math.abs(v);
  const s = a >= 1e6 || a < 1e-4 ? v.toExponential(3).replace(/\.?0+e/, "e") : String(Number(v.toPrecision(5)));
  return s.replace("-", "−");
}

/* ---------- 그리기 ---------- */
let drawPending = false;
function scheduleDraw() {
  if (drawPending) return;
  drawPending = true;
  requestAnimationFrame(() => { drawPending = false; draw(); });
}
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function draw() {
  if (state.mode !== "graph" || !gW) return;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = cssVar("--panel-bg"), fg = cssVar("--panel-fg"), lineC = cssVar("--line"), muted = cssVar("--muted");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, gW, gH);

  const xmin = fromPx(0), xmax = fromPx(gW), ymin = fromPy(gH), ymax = fromPy(0);
  const usePi = G.piTicks && !G.deg;
  const xs = usePi ? piStep(80 / G.ppu) : niceStep(80 / G.ppu);
  const ys = niceStep(70 / G.ppu);

  // 격자선 그리기 도우미
  const grid = (sx, sy) => {
    ctx.beginPath();
    for (let k = Math.ceil(xmin / sx); k * sx <= xmax; k++) { const p = Math.round(toPx(k * sx)) + 0.5; ctx.moveTo(p, 0); ctx.lineTo(p, gH); }
    for (let k = Math.ceil(ymin / sy); k * sy <= ymax; k++) { const p = Math.round(toPy(k * sy)) + 0.5; ctx.moveTo(0, p); ctx.lineTo(gW, p); }
    ctx.stroke();
  };
  ctx.lineWidth = 1;
  ctx.strokeStyle = lineC;
  ctx.globalAlpha = 0.45; grid(xs.minor, ys.minor);     // 잔 격자
  ctx.globalAlpha = 1;    grid(xs.step, ys.step);       // 큰 격자

  // x축, y축
  const axY = toPy(0), axX = toPx(0);
  ctx.strokeStyle = fg; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (axY >= 0 && axY <= gH) { ctx.moveTo(0, Math.round(axY) + 0.5); ctx.lineTo(gW, Math.round(axY) + 0.5); }
  if (axX >= 0 && axX <= gW) { ctx.moveTo(Math.round(axX) + 0.5, 0); ctx.lineTo(Math.round(axX) + 0.5, gH); }
  ctx.stroke();

  // 눈금 숫자 (축이 화면 밖이면 가장자리에)
  ctx.font = "12px system-ui, -apple-system, 'Malgun Gothic', sans-serif";
  ctx.lineWidth = 3; ctx.strokeStyle = bg; ctx.fillStyle = muted;   // 숫자 뒤에 바탕색 테두리 → 선과 겹쳐도 잘 보임
  const label = (t, x, y) => { ctx.strokeText(t, x, y); ctx.fillText(t, x, y); };
  const ly = Math.min(Math.max(axY + 4, 4), gH - 18);
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let k = Math.ceil(xmin / xs.step); k * xs.step <= xmax; k++) {
    if (k === 0) continue;
    const v = k * xs.step, px = toPx(v);
    if (px < 12 || px > gW - 12) continue;
    label(usePi ? piLabel(v) : tickLabel(v, xs.step), px, ly);
  }
  let lx, align;
  if (axX < 40) { lx = Math.max(axX, 0) + 5; align = "left"; }
  else if (axX > gW) { lx = gW - 5; align = "right"; }
  else { lx = axX - 5; align = "right"; }
  ctx.textAlign = align; ctx.textBaseline = "middle";
  for (let k = Math.ceil(ymin / ys.step); k * ys.step <= ymax; k++) {
    if (k === 0) continue;
    const v = k * ys.step, py = toPy(v);
    if (py < 10 || py > gH - 10) continue;
    label(tickLabel(v, ys.step), lx, py);
  }
  if (axX >= 0 && axX <= gW && axY >= 0 && axY <= gH) { ctx.textAlign = "right"; ctx.textBaseline = "top"; label("0", axX - 4, axY + 4); }

  // 곡선 (입력 중인 함수는 조금 굵게, 맨 위에)
  G.fns.forEach((f, i) => { if (i !== G.active && f.visible && f.ast) drawFn(ctx, f, false); });
  const af = G.fns[G.active];
  if (af && af.visible && af.ast) drawFn(ctx, af, true);

  // 정적분 값, 접선 기울기 이름표
  G.fns.forEach((f) => { if (f.visible && f.ast) calcLabel(ctx, f); });
  // 좌표 추적 점
  drawTrace(ctx, bg, axX, axY);

  // 아직 그릴 식이 없을 때 안내
  if (!G.fns.some((f) => f.ast && f.visible)) {
    ctx.font = "14px system-ui, -apple-system, 'Malgun Gothic', sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "bottom"; ctx.fillStyle = muted;
    ctx.fillText("아래에 식을 입력하면 그래프가 그려져요", 12, gH - 12);
  }
}

// 함수 하나 그리기 (종류에 따라 나눠서)
function drawFn(ctx, f, active) {
  const ineq = f.op !== "=";                       // 부등식이면 영역 색칠
  const dashed = f.op === "<" || f.op === ">";     // 등호가 없는 부등호는 경계선을 점선으로
  const lw = active ? 3 : 2.2;
  if (isYK(f.kind)) {
    if (f.kind === "area") fillArea(ctx, f);               // 정적분: 구간 넓이 색칠
    if (ineq) fillY(ctx, f);
    curveY(ctx, f, lw, dashed);
    if (f.kind === "tangent") {                             // 미분계수: 접선 + 접점
      tangentLine(ctx, f.color, f.tan.a, f.tan.fa, f.tan.m);
      dotAt(ctx, f.color, f.tan.a, f.tan.fa);
    }
  }
  else if (f.kind === "xfy") { if (ineq) fillX(ctx, f); curveX(ctx, f, lw, dashed); }
  else implicitDraw(ctx, f, lw, dashed, ineq);
}
// 정적분 넓이: 곡선과 x축 사이를 a ~ b 구간만 색칠하고, 구간 끝에 세로 점선
function fillArea(ctx, f) {
  const lo = Math.min(f.area.a, f.area.b), hi = Math.max(f.area.a, f.area.b);
  const ay = Math.max(-10, Math.min(gH + 10, toPy(0)));
  const p0 = Math.max(0, Math.floor(toPx(lo))), p1 = Math.min(gW, Math.ceil(toPx(hi)));
  ctx.save(); ctx.fillStyle = f.color; ctx.globalAlpha = 0.28; ctx.beginPath();
  for (let px = p0; px < p1; px++) {
    const x = Math.min(hi, Math.max(lo, fromPx(px + 0.5)));
    const y = evalXY(f.ast, x);
    if (Number.isNaN(y)) continue;
    const py = Math.max(-10, Math.min(gH + 10, toPy(y)));
    ctx.rect(px, Math.min(py, ay), 1.5, Math.abs(py - ay));
  }
  ctx.fill();
  ctx.globalAlpha = 0.85; ctx.setLineDash([4, 4]); ctx.strokeStyle = f.color; ctx.lineWidth = 1.3;
  ctx.beginPath();
  [lo, hi].forEach((v) => {
    const y = evalXY(f.ast, v);
    if (Number.isFinite(y)) { ctx.moveTo(toPx(v), ay); ctx.lineTo(toPx(v), Math.max(-10, Math.min(gH + 10, toPy(y)))); }
  });
  ctx.stroke(); ctx.restore();
}
// 접선: (x0, y0) 를 지나고 기울기 m 인 직선 (m 이 무한대면 세로선)
function tangentLine(ctx, color, x0, y0, m) {
  const C = (v) => Math.max(-1e5, Math.min(1e5, v));
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.globalAlpha = 0.9; ctx.setLineDash([10, 5]);
  ctx.beginPath();
  if (Number.isFinite(m)) {
    const xa = fromPx(0), xb = fromPx(gW);
    ctx.moveTo(0, C(toPy(y0 + m * (xa - x0)))); ctx.lineTo(gW, C(toPy(y0 + m * (xb - x0))));
  } else { ctx.moveTo(toPx(x0), 0); ctx.lineTo(toPx(x0), gH); }
  ctx.stroke(); ctx.restore();
}
// 점 찍기
function dotAt(ctx, color, x, y) {
  ctx.save(); ctx.beginPath(); ctx.arc(toPx(x), toPy(y), 5.5, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = cssVar("--panel-bg"); ctx.stroke(); ctx.restore();
}
// 그래프 위 작은 이름표 (정적분 값, 기울기)
function tag(ctx, text, x, y, color) {
  ctx.save();
  ctx.font = "bold 13px system-ui, -apple-system, 'Malgun Gothic', sans-serif";
  const w = ctx.measureText(text).width + 16, h = 24;
  const lx = Math.min(Math.max(x - w / 2, 4), gW - w - 4), ly = Math.min(Math.max(y - h / 2, 4), gH - h - 4);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(lx, ly, w, h, 7); else ctx.rect(lx, ly, w, h);
  ctx.fillStyle = cssVar("--display-bg"); ctx.globalAlpha = 0.93; ctx.fill();
  ctx.globalAlpha = 1; ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = cssVar("--display-fg"); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, lx + w / 2, ly + h / 2 + 0.5);
  ctx.restore();
}
// 정적분 값, 접선 기울기 이름표
function calcLabel(ctx, f) {
  if (f.kind === "area") {
    const mid = (f.area.a + f.area.b) / 2, ym = evalXY(f.ast, mid);
    const py = Number.isFinite(ym) ? (toPy(ym) + toPy(0)) / 2 : toPy(0);
    tag(ctx, `정적분 = ${coordText(f.area.value)}`, toPx(mid), py, f.color);
  } else if (f.kind === "tangent") {
    tag(ctx, `기울기 = ${coordText(f.tan.m)}`, toPx(f.tan.a), toPy(f.tan.fa) - 26, f.color);
  }
}
// 그래프 위 한 점에서의 접선 기울기 (세로 접선이면 Infinity, 못 구하면 NaN)
function slopeAt(f, pt) {
  try {
    if (isYK(f.kind)) return numDiff((t) => evalXY(f.ast, t), pt.x);
    if (f.kind === "xfy") { const d = numDiff((t) => evalXY(f.ast, undefined, t), pt.y); return d === 0 ? Infinity : 1 / d; }
    // x, y 가 섞인 식: 기울기 = −(x 로 미분) ÷ (y 로 미분)
    const h = 1e-6 * Math.max(1, Math.abs(pt.x), Math.abs(pt.y));
    const fx = (evalXY(f.ast, pt.x + h, pt.y) - evalXY(f.ast, pt.x - h, pt.y)) / (2 * h);
    const fy = (evalXY(f.ast, pt.x, pt.y + h) - evalXY(f.ast, pt.x, pt.y - h)) / (2 * h);
    if (!Number.isFinite(fx) || !Number.isFinite(fy)) return NaN;
    if (Math.abs(fy) < 1e-12 * (1 + Math.abs(fx))) return Infinity;
    const m = -fx / fy;
    return Math.abs(m) < 1e-10 ? 0 : m;
  } catch (e) { return NaN; }
}
// 선 스타일 맞추기
function lineStyle(ctx, f, lw, dashed) {
  ctx.strokeStyle = f.color; ctx.lineWidth = lw;
  ctx.lineJoin = "round"; ctx.lineCap = dashed ? "butt" : "round";
  ctx.setLineDash(dashed ? [8, 6] : []);
}

// y = f(x): 1픽셀마다 값을 구해 선으로 잇고, 점근선(tan x 등)에서는 끊기
function curveY(ctx, f, lw, dashed) {
  ctx.save(); lineStyle(ctx, f, lw, dashed); ctx.beginPath();
  const LIM = 1e5;            // 너무 큰 픽셀 값은 잘라서 그림 (캔버스 오류 방지)
  let prev = null;
  for (let px = -1; px <= gW + 1; px += 1) {
    const x = fromPx(px), y = evalXY(f.ast, x);
    if (Number.isNaN(y)) { prev = null; continue; }
    const py = toPy(y);
    if (prev && Math.abs(py - prev.p) > gH / 2) {
      // 갑자기 크게 뛰면 가운데 값을 확인: 두 점 사이에 있지 않으면 끊긴 곳(점근선)
      const pm = toPy(evalXY(f.ast, (prev.v + x) / 2));
      if (!Number.isFinite(pm) || pm < Math.min(prev.p, py) - 1 || pm > Math.max(prev.p, py) + 1) prev = null;
    }
    const c = Math.max(-LIM, Math.min(LIM, py));
    if (prev) ctx.lineTo(px, c); else ctx.moveTo(px, c);
    prev = { v: x, p: py };
  }
  ctx.stroke(); ctx.restore();
}
// x = g(y): 가로 대신 세로로 1픽셀마다
function curveX(ctx, f, lw, dashed) {
  ctx.save(); lineStyle(ctx, f, lw, dashed); ctx.beginPath();
  const LIM = 1e5;
  let prev = null;
  for (let py = -1; py <= gH + 1; py += 1) {
    const y = fromPy(py), x = evalXY(f.ast, undefined, y);
    if (Number.isNaN(x)) { prev = null; continue; }
    const px = toPx(x);
    if (prev && Math.abs(px - prev.p) > gW / 2) {
      const pm = toPx(evalXY(f.ast, undefined, (prev.v + y) / 2));
      if (!Number.isFinite(pm) || pm < Math.min(prev.p, px) - 1 || pm > Math.max(prev.p, px) + 1) prev = null;
    }
    const c = Math.max(-LIM, Math.min(LIM, px));
    if (prev) ctx.lineTo(c, py); else ctx.moveTo(c, py);
    prev = { v: y, p: px };
  }
  ctx.stroke(); ctx.restore();
}
// y > f(x) 같은 부등식: 세로줄마다 곡선 위(또는 아래)를 색칠
function fillY(ctx, f) {
  const up = f.op === ">" || f.op === "≥";
  ctx.save(); ctx.fillStyle = f.color; ctx.globalAlpha = 0.2; ctx.beginPath();
  for (let px = 0; px < gW; px++) {
    const y = evalXY(f.ast, fromPx(px + 0.5));
    if (Number.isNaN(y)) continue;
    const py = Math.max(0, Math.min(gH, toPy(y)));
    if (up) ctx.rect(px, 0, 1.5, py); else ctx.rect(px, py, 1.5, gH - py);
  }
  ctx.fill(); ctx.restore();
}
// x > g(y) 같은 부등식: 가로줄마다 곡선 오른쪽(또는 왼쪽)을 색칠
function fillX(ctx, f) {
  const right = f.op === ">" || f.op === "≥";
  ctx.save(); ctx.fillStyle = f.color; ctx.globalAlpha = 0.2; ctx.beginPath();
  for (let py = 0; py < gH; py++) {
    const x = evalXY(f.ast, undefined, fromPy(py + 0.5));
    if (Number.isNaN(x)) continue;
    const px = Math.max(0, Math.min(gW, toPx(x)));
    if (right) ctx.rect(px, py, gW - px, 1.5); else ctx.rect(0, py, px, 1.5);
  }
  ctx.fill(); ctx.restore();
}

/* 원, 타원처럼 x, y 가 섞인 식 (F(x, y) = 왼쪽 − 오른쪽)
   1) 화면을 작은 칸으로 나눠 꼭짓점마다 F 값을 계산
   2) 부등식이면 조건을 만족하는 칸을 색칠
   3) F 의 부호가 바뀌는 변에서 0 이 되는 점을 찾아 이어 경계선을 그림 (마칭 스퀘어 방법) */
function implicitDraw(ctx, f, lw, dashed, ineq) {
  let c = gesture && gesture.type !== "trace" ? 8 : 4;          // 화면을 움직이는 중에는 거칠게(빠르게)
  while ((gW / c) * (gH / c) > 90000) c++;
  const nx = Math.ceil(gW / c) + 1, ny = Math.ceil(gH / c) + 1;
  const xs = new Float64Array(nx);
  for (let i = 0; i < nx; i++) xs[i] = fromPx(i * c);
  const v = new Float64Array(nx * ny);
  for (let j = 0; j < ny; j++) {
    const y = fromPy(j * c);
    for (let i = 0; i < nx; i++) v[j * nx + i] = evalXY(f.ast, xs[i], y);
  }
  // 부등식: 조건을 만족하는 칸 색칠
  if (ineq) {
    const ok = f.op === ">" ? (q) => q > 0 : f.op === "≥" ? (q) => q >= 0 : f.op === "<" ? (q) => q < 0 : (q) => q <= 0;
    ctx.save(); ctx.fillStyle = f.color; ctx.globalAlpha = 0.2; ctx.beginPath();
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const q = v[j * nx + i];
      if (!Number.isNaN(q) && ok(q)) ctx.rect(i * c - c / 2, j * c - c / 2, c, c);
    }
    ctx.fill(); ctx.restore();
  }
  // 경계선: 변 위에서 F = 0 인 점 찾기 (점마다 번호를 붙여 이웃끼리 이어 긴 선으로 만듦)
  const P = new Map(), adj = new Map();
  const cross = (key, x1, y1, a, x2, y2, b) => {
    if ((a > 0) === (b > 0)) return null;
    // 변의 가운데 값이 양 끝보다 훨씬 크면 0 이 아니라 끊긴 곳(예: 1/x 의 x = 0) → 건너뜀
    const m = evalXY(f.ast, fromPx((x1 + x2) / 2), fromPy((y1 + y2) / 2));
    if (Number.isNaN(m) || Math.abs(m) > Math.abs(a) + Math.abs(b)) return null;
    const t = a / (a - b);
    if (!P.has(key)) P.set(key, { x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t });
    return key;
  };
  const link = (p, q) => {
    if (!adj.has(p)) adj.set(p, []);
    if (!adj.has(q)) adj.set(q, []);
    adj.get(p).push(q); adj.get(q).push(p);
  };
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = v[j * nx + i], b = v[j * nx + i + 1], cc = v[(j + 1) * nx + i + 1], d = v[(j + 1) * nx + i];
    if (Number.isNaN(a) || Number.isNaN(b) || Number.isNaN(cc) || Number.isNaN(d)) continue;
    const s = (a > 0) + (b > 0) + (cc > 0) + (d > 0);
    if (s === 0 || s === 4) continue;                          // 부호가 다 같으면 경계 없음
    const x0 = i * c, y0 = j * c, H = (ii, jj) => (jj * nx + ii) * 2, V = (ii, jj) => (jj * nx + ii) * 2 + 1;
    const pts = [
      cross(H(i, j), x0, y0, a, x0 + c, y0, b),                // 위 변
      cross(V(i + 1, j), x0 + c, y0, b, x0 + c, y0 + c, cc),   // 오른쪽 변
      cross(H(i, j + 1), x0, y0 + c, d, x0 + c, y0 + c, cc),   // 아래 변
      cross(V(i, j), x0, y0, a, x0, y0 + c, d),                // 왼쪽 변
    ].filter((k) => k !== null);
    if (pts.length >= 2) link(pts[0], pts[1]);
    if (pts.length === 4) link(pts[2], pts[3]);
  }
  ctx.save(); lineStyle(ctx, f, lw, dashed); ctx.beginPath();
  const seen = new Set();
  const walk = (start) => {
    let k = start;
    ctx.moveTo(P.get(k).x, P.get(k).y); seen.add(k);
    for (;;) {
      const nb = adj.get(k).find((q) => !seen.has(q));
      if (nb === undefined) break;
      ctx.lineTo(P.get(nb).x, P.get(nb).y); seen.add(nb); k = nb;
    }
    if (k !== start && adj.get(k).includes(start)) ctx.closePath();   // 원처럼 닫힌 곡선
  };
  for (const [k, list] of adj) if (!seen.has(k) && list.length === 1) walk(k);   // 열린 곡선은 끝에서부터
  for (const k of adj.keys()) if (!seen.has(k)) walk(k);                         // 나머지는 닫힌 곡선
  ctx.stroke(); ctx.restore();
}

/* ---------- 좌표 추적 ---------- */
// 깔끔한 수로 맞추기 (예: 1.03274 → 1.05)
function snapV(v) { const s = niceStep(1 / G.ppu).step; return Math.round(v / s) * s; }
// 화면의 점 p 에서 가장 가까운 '그래프 위의 점' (없으면 null)
function pointOn(f, p) {
  if (isYK(f.kind)) { const x = snapV(fromPx(p.x)), y = evalXY(f.ast, x); return Number.isFinite(y) ? { x, y } : null; }
  if (f.kind === "xfy") { const y = snapV(fromPy(p.y)), x = evalXY(f.ast, undefined, y); return Number.isFinite(x) ? { x, y } : null; }
  // x, y 가 섞인 식: 누른 점에서 곡선 쪽으로 조금씩 옮겨 가기 (뉴턴 방법)
  let x = fromPx(p.x), y = fromPy(p.y);
  const h = 0.5 / G.ppu;
  const grad = (X, Y) => [
    (evalXY(f.ast, X + h, Y) - evalXY(f.ast, X - h, Y)) / (2 * h),
    (evalXY(f.ast, X, Y + h) - evalXY(f.ast, X, Y - h)) / (2 * h),
  ];
  for (let n = 0; n < 12; n++) {
    const F = evalXY(f.ast, x, y);
    const [gx, gy] = grad(x, y);
    const g2 = gx * gx + gy * gy;
    if (!Number.isFinite(F) || !(g2 > 0)) return null;
    x -= (F * gx) / g2; y -= (F * gy) / g2;
    if (Math.abs(F) < 1e-13) break;
  }
  const F = evalXY(f.ast, x, y), [gx, gy] = grad(x, y);
  if (!Number.isFinite(F) || !Number.isFinite(gx) || !Number.isFinite(gy)) return null;
  if ((Math.abs(F) / Math.hypot(gx, gy)) * G.ppu > 1) return null;   // 곡선에서 1픽셀 넘게 떨어져 있으면 실패
  return { x, y };
}
// 누른 곳에서 가장 가까운 그래프 찾기
function nearestFn(p, limit) {
  let best = null;
  G.fns.forEach((f) => {
    if (!f.visible || !f.ast) return;
    const pt = pointOn(f, p);
    if (!pt) return;
    const d = Math.hypot(toPx(pt.x) - p.x, toPy(pt.y) - p.y);
    if (d <= limit && (!best || d < best.d)) best = { f, pt, d };
  });
  return best;
}
function traceAt(p, limit) {
  const b = nearestFn(p, limit);
  G.trace = b ? { id: b.f.id, x: b.pt.x, y: b.pt.y } : null;
  scheduleDraw();
}
// 지금 추적 중인 점 (식을 고쳤을 수도 있으니 다시 계산)
function tracePoint() {
  const f = G.trace && G.fns.find((q) => q.id === G.trace.id);
  if (!f || !f.visible || !f.ast) return null;
  const pt = pointOn(f, { x: toPx(G.trace.x), y: toPy(G.trace.y) });
  return pt ? { f, pt } : null;
}
function nearTracePoint(p) {
  const t = tracePoint();
  return !!t && Math.hypot(toPx(t.pt.x) - p.x, toPy(t.pt.y) - p.y) < 30;
}
// 좌표 추적 점 + 축까지 점선 + 아래 좌표 글자
function drawTrace(ctx, bg, axX, axY) {
  const info = $("gInfo");
  const t = tracePoint();
  if (!t) { info.classList.remove("show"); return; }
  const { f, pt } = t, px = toPx(pt.x), py = toPy(pt.y);
  let html = `<i style="background:${f.color}"></i>x = ${coordText(pt.x)},&nbsp; y = ${coordText(pt.y)}`;
  if (G.tanOn) {                                    // 접선 켜기: 이 점의 접선과 기울기
    const m = slopeAt(f, pt);
    if (!Number.isNaN(m)) tangentLine(ctx, f.color, pt.x, pt.y, m);
    html += `<br><span class="g-slope">기울기 = ${Number.isNaN(m) ? "구할 수 없음" : Number.isFinite(m) ? coordText(m) : "세로 (무한대)"}</span>`;
  }
  info.innerHTML = html;
  info.classList.add("show");
  ctx.save();
  ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2; ctx.strokeStyle = f.color; ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.moveTo(px, py); ctx.lineTo(px, Math.min(Math.max(axY, 0), gH));
  ctx.moveTo(px, py); ctx.lineTo(Math.min(Math.max(axX, 0), gW), py);
  ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2);
  ctx.fillStyle = f.color; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = bg; ctx.stroke();
}

/* ---------- 손가락·마우스 조작 ---------- */
const ptrs = new Map();   // 화면에 닿아 있는 손가락(포인터)들
let gesture = null;       // 지금 하고 있는 동작: pan(이동) / pinch(확대) / trace(점 따라가기)
function gpos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

canvas.addEventListener("pointerdown", (e) => {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 일부 기기에서 실패해도 동작에는 문제없음 */ }
  const p = gpos(e);
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) {
    gesture = nearTracePoint(p) ? { type: "trace" } : { type: "pan", sx: p.x, sy: p.y, cx: G.cx, cy: G.cy, moved: false };
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    gesture = { type: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, ppu0: G.ppu, wx: fromPx(m.x), wy: fromPy(m.y) };
  }
});
canvas.addEventListener("pointermove", (e) => {
  const p = gpos(e);
  if (!ptrs.has(e.pointerId)) {
    // 마우스를 그냥 움직일 때: 곡선 근처면 좌표 보여 주기 (노트북)
    if (e.pointerType === "mouse") traceAt(p, 30);
    return;
  }
  ptrs.set(e.pointerId, p);
  if (!gesture) return;
  if (gesture.type === "pan") {
    const dx = p.x - gesture.sx, dy = p.y - gesture.sy;
    if (!gesture.moved && Math.hypot(dx, dy) < 6) return;     // 살짝 떨린 건 무시 (탭으로 봄)
    gesture.moved = true;
    canvas.style.cursor = "grabbing";
    G.cx = gesture.cx - dx / G.ppu;
    G.cy = gesture.cy + dy / G.ppu;
    scheduleDraw();
  } else if (gesture.type === "trace") {
    const t = tracePoint(), pt = t && pointOn(t.f, p);      // 점을 그래프 따라 끌기
    if (pt) { G.trace.x = pt.x; G.trace.y = pt.y; }
    scheduleDraw();
  } else if (gesture.type === "pinch" && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    G.ppu = clampPpu(gesture.ppu0 * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d0);
    G.cx = gesture.wx - (m.x - gW / 2) / G.ppu;               // 두 손가락 가운데 지점이 고정되도록
    G.cy = gesture.wy + (m.y - gH / 2) / G.ppu;
    scheduleDraw();
  }
});
function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  const tap = gesture && gesture.type === "pan" && !gesture.moved && ptrs.size === 1 && e.type === "pointerup";
  ptrs.delete(e.pointerId);
  canvas.style.cursor = "";
  if (tap) traceAt(gpos(e), 40);                              // 탭: 곡선 근처면 좌표 표시, 아니면 지우기
  if (ptrs.size === 0) { gesture = null; scheduleDraw(); }   // 다 놓으면 다시 곱게 그리기
  else if (ptrs.size === 1 && gesture && gesture.type === "pinch") {
    const p = [...ptrs.values()][0];
    gesture = { type: "pan", sx: p.x, sy: p.y, cx: G.cx, cy: G.cy, moved: true };
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", (e) => {                        // 마우스 휠 확대/축소
  e.preventDefault();
  const p = gpos(e);
  zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

/* ---------- 그래프 도구 버튼 ---------- */
document.querySelector(".g-tools").addEventListener("mousedown", (e) => e.preventDefault());
document.querySelector(".g-tools").addEventListener("click", (e) => {
  const b = e.target.closest("[data-g]");
  if (!b) return;
  const g = b.dataset.g;
  if (g === "in") zoomAt(gW / 2, gH / 2, 1.5);
  if (g === "out") zoomAt(gW / 2, gH / 2, 1 / 1.5);
  if (g === "home") homeView();
  if (g === "pi") {
    G.piTicks = !G.piTicks;
    b.classList.toggle("on", G.piTicks);
    if (G.piTicks && G.deg) toast("π 눈금은 RAD 일 때 쓸 수 있어요");
    scheduleDraw();
  }
  if (g === "deg") toggleDeg();
  if (g === "png") savePng();
  if (g === "tan") {                                 // 접선 켜기/끄기
    G.tanOn = !G.tanOn;
    b.classList.toggle("on", G.tanOn);
    toast(G.tanOn ? "그래프 위의 점을 누르면 접선과 기울기를 보여 줘요" : "접선 보기를 껐어요");
    scheduleDraw();
  }
});

/* ---------- 그림으로 저장 (식 목록을 왼쪽 위에 함께 적음) ---------- */
// 식 구조 → 사람이 읽는 한 줄 글자 (그림 범례용)
function plainText(row) {
  const wrap = (r) => (r.length > 1 ? `(${plainText(r)})` : plainText(r));
  return row.map((it) => {
    if (!isNode(it)) return it.v === "-" ? "−" : it.v === "," ? ", " : isRel(it) ? ` ${it.v} ` : it.v;
    const P = (k) => plainText(it[k]);
    switch (it.t) {
      case "frac": return `${wrap(it.num)}/${wrap(it.den)}`;
      case "pow": { const e = plainText(it.exp); return /^-?\d+$/.test(e) ? toSup(e) : `^(${e})`; }
      case "sqrt": return `√${wrap(it.body)}`;
      case "root": return `${toSup(P("idx"))}√${wrap(it.body)}`;
      case "par": return `(${P("body")})`;
      case "func": {
        if (it.name === "rand") return "난수";
        const nm = { asin: "sin⁻¹", acos: "cos⁻¹", atan: "tan⁻¹", asinh: "sinh⁻¹", acosh: "cosh⁻¹", atanh: "tanh⁻¹",
          mean: "평균", round: "반올림", floor: "내림", ceil: "올림" }[it.name] || it.name;
        return `${nm}(${P("body")})`;
      }
      case "func2": return `${it.name}(${P("a")}, ${P("b")})`;
      case "logb": return `log${wrap(it.base)}(${P("arg")})`;
      case "ncr": return `${P("n")}C${P("r")}`;
      case "npr": return `${P("n")}P${P("r")}`;
      case "abs": return `|${P("body")}|`;
      case "deriv": return `d/d${P("v")}(${P("body")})|${P("v")}=${P("at")}`;
      case "deriv1": return `d/d${P("v")}(${P("body")})`;
      case "integ": return `∫[${P("lo")}~${P("hi")}] ${P("body")} d${P("v")}`;
      case "grad": return `∇(${P("body")})|(${P("pt")})`;
    }
    return "";
  }).join("");
}
function savePng() {
  draw();
  const out = document.createElement("canvas");
  out.width = canvas.width; out.height = canvas.height;
  const c = out.getContext("2d");
  c.drawImage(canvas, 0, 0);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const items = G.fns.filter((f) => f.visible && f.ast);
  if (items.length) {
    c.font = "16px 'Times New Roman', serif";
    const lines = items.map((f) => (f.hasRel ? plainText(f.tree) : `y = ${plainText(f.tree)}`));
    const w = Math.min(gW - 20, Math.max(...lines.map((t) => c.measureText(t).width)) + 40);
    c.fillStyle = cssVar("--panel-bg"); c.globalAlpha = 0.92;
    c.fillRect(10, 10, w, lines.length * 22 + 10);
    c.globalAlpha = 1;
    c.textBaseline = "middle"; c.textAlign = "left";
    lines.forEach((t, i) => {
      const y = 25 + i * 22;
      c.fillStyle = items[i].color; c.fillRect(18, y - 2, 16, 4);
      c.fillStyle = cssVar("--panel-fg"); c.fillText(t, 40, y, w - 34);
    });
  }
  out.toBlob((blob) => {
    if (!blob) { toast("그림을 저장하지 못했어요"); return; }
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `그래프_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

/* =====================================================================
   16. 문자(계수·상수) 값 입력
   - 식에 x, y 말고 a, b, k, m 같은 문자를 쓰면 값 입력 칸이 생김
   - 계산기: 값 칸 (예: ½mv² 에서 m, v)
   - 그래프: 값 칸 + 슬라이더 + ▶(자동으로 움직이기)
   ===================================================================== */
// 문자 값 정하기 (계산할 때 찾아보는 표 PV 도 함께)
function setParam(n, v) {
  ensureParam(n);
  PARAMS[n].value = v;
  if (v === undefined) delete PV[n]; else PV[n] = v;
}
// 처음 보는 문자면 자리 만들기 (def: 기본값)
function ensureParam(n, def) {
  if (!PARAMS[n]) PARAMS[n] = { value: undefined, min: -10, max: 10, playing: false, dir: 1 };
  if (def !== undefined && PARAMS[n].value === undefined) setParam(n, def);
}
// 값 글자 (소수 셋째 자리까지)
const paramText = (v) => (v === undefined ? "" : String(Number(v.toFixed(3))));
// 값 칸에 쓴 글자 → 숫자 (2π, 1/2, -3 같은 짧은 식도 됨, 다른 문자는 안 됨)
function parseParamText(t) {
  t = String(t).trim();
  if (!t) return undefined;
  try {
    const v = new Parser(tokenize(t.replace(/\*/g, "×").replace(/\//g, "÷")), false).parseAll();
    const r = evaluate(v, { deg: state.deg, ans: state.ans });
    return Number.isFinite(r) ? r : NaN;
  } catch (e) { return NaN; }
}
// 슬라이더 범위를 값이 들어가도록 넓히기
function fitRange(n) {
  const p = PARAMS[n], v = p.value;
  if (v === undefined) return;
  if (v < p.min) p.min = Math.floor(v - Math.max(1, Math.abs(v) * 0.5));
  if (v > p.max) p.max = Math.ceil(v + Math.max(1, Math.abs(v) * 0.5));
}

/* ---------- 값 입력 칸 그리기 ----------
   panel: 넣을 곳, names: 문자 목록, kind: "calc"(값 칸만) / "graph"(값 칸 + 슬라이더 + ▶) */
function renderParamPanel(panel, names, kind) {
  const key = names.join(",");
  if (panel.dataset.key === key) return;              // 문자 목록이 같으면 다시 그리지 않음 (입력 중인 칸 유지)
  panel.dataset.key = key;
  panel.hidden = names.length === 0;
  if (!names.length) { panel.innerHTML = ""; return; }
  if (kind === "calc") {
    panel.innerHTML = `<span class="p-title">문자 값</span>` + names.map((n) =>
      `<label class="p-chip" data-n="${n}"><span class="p-name"><i>${n}</i> =</span>` +
      `<input class="p-val" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="${paramText(PARAMS[n] && PARAMS[n].value)}" placeholder="값" aria-label="${n} 의 값"></label>`).join("");
  } else {
    panel.innerHTML = names.map((n) => {
      const p = PARAMS[n];
      return `<div class="p-row" data-n="${n}"><span class="p-name"><i>${n}</i> =</span>` +
        `<input class="p-val" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="${paramText(p.value)}" aria-label="${n} 의 값">` +
        `<input class="p-sl" type="range" min="${p.min}" max="${p.max}" step="${(p.max - p.min) / 400}" value="${p.value}" aria-label="${n} 슬라이더">` +
        `<button class="p-play${p.playing ? " on" : ""}" type="button" title="${n} 값을 자동으로 움직이기" aria-label="${n} 자동으로 움직이기">${p.playing ? "❚❚" : "▶"}</button></div>`;
    }).join("");
  }
}
// 칸 하나의 표시를 지금 값에 맞추기 (슬라이더를 움직이거나 자동 재생할 때)
function syncParamRow(panel, n, skipText) {
  const row = panel.querySelector(`[data-n="${n}"]`);
  if (!row) return;
  const p = PARAMS[n];
  const tx = row.querySelector(".p-val"), sl = row.querySelector(".p-sl");
  if (!skipText) { tx.value = paramText(p.value); tx.classList.remove("bad"); }
  if (sl) { sl.min = p.min; sl.max = p.max; sl.step = (p.max - p.min) / 400; sl.value = p.value; }
}

/* ---------- 계산기의 값 칸 ---------- */
const cParamsEl = $("cParams");
function updateCalcParams() {
  let names = [];
  try {
    const tree = new Parser(tokenize(serialize(root)), true).parseAll();
    names = [...freeVars(tree)].sort();
  } catch (e) { names = (cParamsEl.dataset.key || "").split(",").filter(Boolean); }   // 입력 중이라 못 읽으면 그대로
  names.forEach((n) => ensureParam(n));
  renderParamPanel(cParamsEl, names, "calc");
}
cParamsEl.addEventListener("input", (e) => {
  const chip = e.target.closest(".p-chip");
  if (!chip) return;
  const v = parseParamText(e.target.value);
  e.target.classList.toggle("bad", Number.isNaN(v));
  setParam(chip.dataset.n, Number.isNaN(v) ? undefined : v);
  state.justEvaluated = false;                         // 값을 바꾸면 결과를 다시 미리 계산
  refresh();
});
cParamsEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doEvaluate(); } });

/* ---------- 그래프의 값 칸 + 슬라이더 ---------- */
const gParamsEl = $("gParams");
function updateGraphParams() {
  const names = new Set();
  G.fns.forEach((f) => (f.params || []).forEach((n) => names.add(n)));
  renderParamPanel(gParamsEl, [...names].sort(), "graph");
}
// 값이 바뀌면: 모든 식을 다시 계산(정적분 값, 접선 기울기 등)하고 다시 그리기
function onGraphParamChange() {
  G.fns.forEach((f) => { if (f !== G.fns[G.active]) compileFn(f); });
  G.fns[G.active].tree = root; compileFn(G.fns[G.active]);
  scheduleDraw();
}
gParamsEl.addEventListener("input", (e) => {
  const row = e.target.closest(".p-row");
  if (!row) return;
  const n = row.dataset.n;
  if (e.target.classList.contains("p-sl")) {            // 슬라이더
    setParam(n, Number(e.target.value));
    syncParamRow(gParamsEl, n);
  } else {                                              // 값 칸에 직접 쓰기
    const v = parseParamText(e.target.value);
    const bad = v === undefined || Number.isNaN(v);
    e.target.classList.toggle("bad", bad);
    if (bad) return;
    setParam(n, v); fitRange(n); syncParamRow(gParamsEl, n, true);
  }
  onGraphParamChange();
});
gParamsEl.addEventListener("mousedown", (e) => { if (e.target.closest(".p-play")) e.preventDefault(); });
gParamsEl.addEventListener("click", (e) => {
  const b = e.target.closest(".p-play");
  if (!b) return;
  const p = PARAMS[b.closest(".p-row").dataset.n];
  p.playing = !p.playing;
  b.classList.toggle("on", p.playing);
  b.textContent = p.playing ? "❚❚" : "▶";
  if (p.playing && !playRAF) playRAF = requestAnimationFrame(playLoop);
});
// ▶ 자동으로 움직이기: 범위 안에서 왔다 갔다 (한쪽 끝까지 약 4초)
let playRAF = null;
function playLoop() {
  let any = false;
  if (state.mode === "graph") {
    Object.keys(PARAMS).forEach((n) => {
      const p = PARAMS[n];
      if (!p.playing || !gParamsEl.querySelector(`[data-n="${n}"]`)) return;
      any = true;
      let v = (p.value === undefined ? 0 : p.value) + p.dir * (p.max - p.min) / 240;
      if (v >= p.max) { v = p.max; p.dir = -1; }
      if (v <= p.min) { v = p.min; p.dir = 1; }
      setParam(n, v);
      syncParamRow(gParamsEl, n);
    });
  }
  if (any) { onGraphParamChange(); playRAF = requestAnimationFrame(playLoop); }
  else playRAF = null;
}

/* =====================================================================
   14. 시작
   ===================================================================== */
buildKeys();
buildThemeMenu();
let savedTheme = "yellow";
try { savedTheme = localStorage.getItem("sci-calc-theme") || "yellow"; } catch (e) {}
applyTheme(savedTheme);
renderHistory();
refresh();
if (!IS_TOUCH) editorEl.focus({ preventScroll: true });

// 시험용으로 바깥에서 쓸 수 있게 (검증 스크립트용, 화면에는 영향 없음)
window.__calc = { calculate, formatNumber, toFraction, state, G, PV, setParam, serialize: () => serialize(root), setMode, redraw: () => draw() };
</script>
</body>
