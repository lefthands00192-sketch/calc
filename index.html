<!DOCTYPE html>
<html lang="ko" data-theme="yellow">
<head>
<meta charset="UTF-8">
<!-- 휴대폰에서 화면 폭에 맞추고, 노치(아이폰) 영역까지 고려 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9a300">
<title>공학용 계산기</title>
<style>
/* =========================================================
   1. 테마 색상 (CSS 변수)
   - data-theme 값만 바꾸면 전체 색이 바뀜
   - 기본값: yellow (짙은 노랑)
   ========================================================= */
:root, [data-theme="yellow"] {
  --pin-bg: #fff8dc; --pin-fg: #8a3b00; --pin-line: #a87700;   /* 자주 쓰는 수식 키 */
  --bg: #d9a300;            /* 바탕 */
  --bg2: #c48f00;           /* 바탕 그라데이션 아래쪽 */
  --head-fg: #3a2900;       /* 상단 제목 글자 */
  --display-bg: #fff8dc;    /* 계산 화면 */
  --display-fg: #3a2900;
  --muted: #8a6d22;         /* 흐린 글자 */
  --num-bg: #fff3c4;  --num-fg: #3a2900;   /* 숫자 키 */
  --fn-bg: #a87700;   --fn-fg: #fff8e1;    /* 함수 키 */
  --op-bg: #5a3e00;   --op-fg: #ffd84d;    /* 연산자 키 */
  --ctl-bg: #7d5a00;  --ctl-fg: #fff3c4;   /* 조작 키 */
  --eq-bg: #d9480f;   --eq-fg: #ffffff;    /* = 키 */
  --tab-bg: #b98400;  --tab-fg: #fff3c4; --tab-on-bg: #fff8dc; --tab-on-fg: #3a2900;
  --panel-bg: #fff8dc; --panel-fg: #3a2900; --line: #e9d9a6;
  --accent: #d9480f;  --err: #c0262d;
  --ph: #c9a74a;            /* 빈칸 상자 테두리 */
  --shadow: 0 2px 0 rgba(0,0,0,.18);
}
[data-theme="night"] {
  --pin-bg: #2c4466; --pin-fg: #ffe08a; --pin-line: #ffd166;   /* 자주 쓰는 수식 키 */
  --bg: #121a2b; --bg2: #0a0f1a; --head-fg: #e6ebf5;
  --display-bg: #1c2740; --display-fg: #eef2fa; --muted: #8b98b5;
  --num-bg: #2a3654; --num-fg: #eef2fa;
  --fn-bg: #1f4a73; --fn-fg: #d8ecff;
  --op-bg: #3a4766; --op-fg: #ffd166;
  --ctl-bg: #33405e; --ctl-fg: #cdd6ea;
  --eq-bg: #ffb703; --eq-fg: #1b1b1b;
  --tab-bg: #24304b; --tab-fg: #aab6d0; --tab-on-bg: #ffd166; --tab-on-fg: #1b1b1b;
  --panel-bg: #1c2740; --panel-fg: #eef2fa; --line: #2f3c5c;
  --accent: #ffb703; --err: #ff7b7b; --ph: #5d6b8c;
  --shadow: 0 2px 0 rgba(0,0,0,.35);
}
[data-theme="mint"] {
  --pin-bg: #ffffff; --pin-fg: #0f4d41; --pin-line: #17705f;   /* 자주 쓰는 수식 키 */
  --bg: #2aa78f; --bg2: #1d8a75; --head-fg: #f2fffb;
  --display-bg: #effcf8; --display-fg: #0f3d34; --muted: #4f8a7d;
  --num-bg: #ffffff; --num-fg: #0f3d34;
  --fn-bg: #17705f; --fn-fg: #e6fff8;
  --op-bg: #0f4d41; --op-fg: #b8ffe9;
  --ctl-bg: #1a5e51; --ctl-fg: #e6fff8;
  --eq-bg: #ff7a59; --eq-fg: #ffffff;
  --tab-bg: #1f8c77; --tab-fg: #d9fff5; --tab-on-bg: #effcf8; --tab-on-fg: #0f3d34;
  --panel-bg: #effcf8; --panel-fg: #0f3d34; --line: #c7ebe1;
  --accent: #ff7a59; --err: #c62828; --ph: #7fbcae;
  --shadow: 0 2px 0 rgba(0,0,0,.15);
}
[data-theme="sakura"] {
  --pin-bg: #ffffff; --pin-fg: #7a2347; --pin-line: #c2507a;   /* 자주 쓰는 수식 키 */
  --bg: #f19bb3; --bg2: #e47d9b; --head-fg: #4a1428;
  --display-bg: #fff4f7; --display-fg: #4a1428; --muted: #a0577a;
  --num-bg: #ffffff; --num-fg: #4a1428;
  --fn-bg: #c2507a; --fn-fg: #fff0f5;
  --op-bg: #7a2347; --op-fg: #ffd3e2;
  --ctl-bg: #9c3a62; --ctl-fg: #fff0f5;
  --eq-bg: #6a3fb5; --eq-fg: #ffffff;
  --tab-bg: #d76890; --tab-fg: #fff0f5; --tab-on-bg: #fff4f7; --tab-on-fg: #4a1428;
  --panel-bg: #fff4f7; --panel-fg: #4a1428; --line: #f5d0dc;
  --accent: #6a3fb5; --err: #c0262d; --ph: #e0a0b8;
  --shadow: 0 2px 0 rgba(0,0,0,.15);
}
[data-theme="ocean"] {
  --pin-bg: #ffffff; --pin-fg: #123a63; --pin-line: #1d4f86;   /* 자주 쓰는 수식 키 */
  --bg: #2f6fb3; --bg2: #245890; --head-fg: #f0f7ff;
  --display-bg: #f0f7ff; --display-fg: #12304f; --muted: #557aa3;
  --num-bg: #ffffff; --num-fg: #12304f;
  --fn-bg: #1d4f86; --fn-fg: #e3f0ff;
  --op-bg: #123a63; --op-fg: #9fd3ff;
  --ctl-bg: #2a5d94; --ctl-fg: #e3f0ff;
  --eq-bg: #ffb020; --eq-fg: #1b1b1b;
  --tab-bg: #3a7cc0; --tab-fg: #e3f0ff; --tab-on-bg: #f0f7ff; --tab-on-fg: #12304f;
  --panel-bg: #f0f7ff; --panel-fg: #12304f; --line: #cfe0f3;
  --accent: #e08a00; --err: #c0262d; --ph: #8fb2d8;
  --shadow: 0 2px 0 rgba(0,0,0,.18);
}
[data-theme="contrast"] {
  --pin-bg: #000000; --pin-fg: #ffff00; --pin-line: #ffff00;   /* 자주 쓰는 수식 키 */
  --bg: #000000; --bg2: #000000; --head-fg: #ffffff;
  --display-bg: #000000; --display-fg: #ffffff; --muted: #cccccc;
  --num-bg: #ffffff; --num-fg: #000000;
  --fn-bg: #000000; --fn-fg: #ffff00;
  --op-bg: #000000; --op-fg: #00ffff;
  --ctl-bg: #000000; --ctl-fg: #ffffff;
  --eq-bg: #ffff00; --eq-fg: #000000;
  --tab-bg: #000000; --tab-fg: #ffffff; --tab-on-bg: #ffff00; --tab-on-fg: #000000;
  --panel-bg: #000000; --panel-fg: #ffffff; --line: #666666;
  --accent: #ffff00; --err: #ff6b6b; --ph: #aaaaaa;
  --shadow: inset 0 0 0 2px #ffffff;
}

/* =========================================================
   2. 기본 설정
   ========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  background: linear-gradient(180deg, var(--bg), var(--bg2));
  color: var(--display-fg);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;   /* 휴대폰 터치 시 파란 박스 없애기 */
}
button { font-family: inherit; }

/* 전체 틀: 위(제목줄) + 아래(본문) */
.app {
  display: flex; flex-direction: column;
  min-height: 100vh; min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* =========================================================
   3. 상단 제목줄
   ========================================================= */
.topbar {
  flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  height: 48px; padding: 0 12px;
  color: var(--head-fg);
}
.topbar h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; }
.top-actions { display: flex; gap: 6px; }
.top-btn {
  height: 34px; padding: 0 12px; border-radius: 17px; border: 0;
  background: var(--display-bg); color: var(--display-fg);
  font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow);
}
.top-btn .count {
  display: inline-block; min-width: 20px; padding: 0 5px; margin-left: 4px;
  border-radius: 10px; background: var(--accent); color: #fff; font-size: 12px; line-height: 20px; text-align: center;
}
[data-theme="contrast"] .top-btn { border: 2px solid #fff; }

/* =========================================================
   4. 본문 배치
   - 좁은 화면(휴대폰): 계산기만 보이고, 기록은 아래에서 올라오는 창
   - 넓은 화면(태블릿 가로, 노트북): 계산기 + 기록 나란히
   ========================================================= */
.layout {
  flex: 1;
  display: flex; justify-content: center; gap: 14px;
  padding: 0 10px 10px;
  /* 화면 높이에 맞추되, 너무 낮으면 스크롤 되도록 최소 높이 지정 */
  height: calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  min-height: 500px;
}
.calc {
  flex: 1 1 auto; width: 100%; max-width: 520px; min-width: 0;
  display: flex; flex-direction: column; gap: 8px;
}

/* =========================================================
   5. 계산 화면 (교과서 모양 수식 입력칸 + 결과)
   ========================================================= */
.display {
  flex: none;
  background: var(--display-bg); color: var(--display-fg);
  border-radius: 16px; padding: 8px 12px 10px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
[data-theme="contrast"] .display { border: 2px solid #fff; }
.disp-top { display: flex; align-items: center; gap: 8px; min-height: 22px; font-size: 12px; color: var(--muted); }
button.badge { border: 0; cursor: pointer; font-family: inherit; line-height: 1.5; }
.badge {
  flex: none; padding: 1px 7px; border-radius: 6px; font-weight: 800; font-size: 11px;
  background: var(--accent); color: #fff; letter-spacing: .5px;
}
[data-theme="contrast"] .badge, [data-theme="night"] .badge { color: #000; }
.ans-info { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kbd-btn {
  flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
  border-radius: 6px; font-size: 12px; padding: 2px 6px; cursor: pointer; display: none;
}
.kbd-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
/* 휴대폰 자판으로 입력할 때 글자를 받는 숨은 칸 (화면에는 안 보임) */
#kbdSink { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; pointer-events: none; }

/* 수식 입력칸: 분수, 지수, 루트가 교과서 모양 그대로 보이고, 빈칸을 눌러 커서를 옮김 */
.editor {
  min-height: 74px; padding: 6px 2px;
  font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif;
  font-size: 26px; line-height: 1.25;
  white-space: nowrap; overflow-x: auto; overflow-y: hidden;
  display: flex; align-items: center;
  border-bottom: 1px dashed var(--line);
  outline: none; cursor: text;
  scrollbar-width: thin;
  -webkit-user-select: none; user-select: none;
}
.editor:focus-visible { border-bottom-color: var(--accent); }
.editor > .row { padding: 0 6px 0 2px; }
.editor .hint { font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); white-space: normal; line-height: 1.4; }

/* 결과 줄 */
.result {
  min-height: 40px;
  display: flex; align-items: center; justify-content: flex-end; gap: 10px;
  font-size: 30px; font-weight: 700;
  white-space: nowrap; overflow-x: auto; overflow-y: hidden;
  font-variant-numeric: tabular-nums;
}
.result .val { opacity: .45; }               /* 입력 중 미리 보는 결과는 흐리게 */
.result.final .val { opacity: 1; }           /* = 누른 뒤에는 진하게 */
.result .err { font-size: 15px; font-weight: 700; color: var(--err); white-space: normal; text-align: right; }
.result .fracchip {
  font-family: "Cambria Math", "Times New Roman", serif; font-weight: 400;
  font-size: 18px; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted);
}

/* ---------- 수식 모양 (분수, 지수, 루트, 괄호 등) ---------- */
.row { display: inline-block; }
.m-op { margin: 0 .18em; }
.m-comma { margin-right: .2em; }
.m-e { font-style: italic; }
.m-ans { font-family: system-ui, sans-serif; font-size: .75em; font-weight: 700; padding: 0 .1em; }
.m-fn { font-family: system-ui, sans-serif; font-size: .8em; }
.m-let { font-family: system-ui, sans-serif; font-size: .8em; color: var(--muted); }
/* 빈칸 상자 □ */
.m-ph {
  display: inline-block; min-width: .62em; height: .95em; vertical-align: -.12em;
  border: 1.5px dashed var(--ph); border-radius: 3px; margin: 0 .06em;
  text-align: left;
}
.m-ph.on { border-style: solid; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
/* 깜박이는 커서 */
.cur {
  display: inline-block; width: 2px; height: 1.05em; margin: 0 -1px; vertical-align: -.18em;
  background: var(--accent); animation: blink 1s steps(1) infinite;
}
.m-ph .cur { vertical-align: top; margin-left: 1px; height: 100%; }
@keyframes blink { 50% { opacity: 0; } }
/* 분수 */
.m-frac {
  display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: middle; margin: 0 .12em; font-size: .9em;
}
.m-frac > .fn, .m-frac > .fd { align-self: stretch; text-align: center; }   /* 분수 선이 분자·분모 중 넓은 쪽에 맞게 */
.m-frac > .fn { padding: 0 .2em .06em; border-bottom: 1.5px solid currentColor; }
.m-frac > .fd { padding: .06em .2em 0; }
/* 지수(위첨자), 아래첨자 */
.m-sup { display: inline-block; font-size: .66em; vertical-align: .8em; line-height: 1; }
.m-sub { display: inline-block; font-size: .66em; vertical-align: -.55em; line-height: 1; }   /* 아래첨자: 기준선 아래로 */
/* 루트: 글꼴마다 √ 모양이 달라서 그림(SVG)으로 직접 그림 → 모든 기기에서 같은 모양 */
.m-sqrt { display: inline-block; position: relative; padding-left: .62em; margin: 0 .05em; }
.m-sqrt.has-idx { padding-left: .85em; }
.m-sqrt .sign { position: absolute; left: 0; top: 0; bottom: 0; width: .62em; height: 100%; overflow: visible; }
.m-sqrt.has-idx .sign { left: .23em; }
.m-sqrt .body { display: inline-block; border-top: 1.5px solid currentColor; padding: .12em .12em 0 .04em; line-height: 1.1; }
.m-sqrt .idx { position: absolute; left: 0; top: -.05em; font-size: .55em; line-height: 1; }
/* 괄호: 안에 분수가 있으면 괄호도 같이 커지도록 그림으로 그림 */
.m-par { display: inline-block; position: relative; padding: 0 .36em; }
.m-par > .pl, .m-par > .pr { position: absolute; top: 0; height: 100%; width: .32em; overflow: visible; }
.m-par > .pl { left: .02em; } .m-par > .pr { right: .02em; }
.m-par > .row { padding: .04em 0; }
.m-abs { display: inline-block; border-left: 1.5px solid currentColor; border-right: 1.5px solid currentColor; padding: .04em .15em; margin: 0 .1em; }
.sign path, .pl path, .pr path { fill: none; stroke: currentColor; stroke-width: 1.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.m-ghost { opacity: .35; }
.m-sci { font-size: .8em; }
.m-sci .m-sup { font-size: .75em; }

/* =========================================================
   6. 키패드
   - 한 개의 격자(5칸)로 모든 버튼을 배치 → 칸이 겹칠 일이 없음
   - 행 높이는 화면 높이에 맞춰 늘어나고, 최소 높이 보장
   ========================================================= */
.keys {
  flex: 1 1 0; min-height: 0;     /* 남은 높이를 키패드가 나눠 가짐 */
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-template-rows:
    34px                              /* 탭 줄 */
    repeat(3, minmax(34px, 1fr))      /* 함수 키 3줄 (탭에 따라 바뀜) */
    minmax(38px, 1.1fr)               /* 자주 쓰는 수식 키 줄 (분수, 제곱 등) */
    minmax(34px, .85fr)               /* 조작 키 줄 (◀ ▶ DEG ⌫ AC) */
    repeat(4, minmax(40px, 1.25fr));  /* 숫자 키 4줄 */
  gap: 6px;
}
.tabs { grid-column: 1 / -1; display: flex; gap: 6px; min-width: 0; }
.tab {
  flex: 1 1 0; min-width: 0; border: 0; border-radius: 10px;
  background: var(--tab-bg); color: var(--tab-fg);
  font-size: 14px; font-weight: 700; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tab.on { background: var(--tab-on-bg); color: var(--tab-on-fg); box-shadow: var(--shadow); }
[data-theme="contrast"] .tab { border: 2px solid #fff; }

.key {
  min-width: 0; min-height: 0; width: 100%; height: 100%;
  border: 0; border-radius: 12px; padding: 0 2px;
  font-size: 18px; font-weight: 600; line-height: 1;
  cursor: pointer; user-select: none; -webkit-user-select: none;
  touch-action: manipulation;          /* 두 번 탭해도 화면 확대 안 되게 */
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; white-space: nowrap;
  transition: transform .05s, filter .1s;
}
.key:active, .key.pressed { transform: translateY(2px); filter: brightness(.88); box-shadow: none; }
.key:focus-visible, .tab:focus-visible, .top-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.kl { display: inline-block; line-height: 1; white-space: nowrap; }
/* 버튼 위 첨자: 위첨자(지수)는 밑의 오른쪽 위 모서리에, 아래첨자(밑, n, r)는 기준선 아래로 확실히
   position 으로 옮겨서 버튼 높이에는 영향 없이 위치만 바뀜 */
.key sup, .key sub { font-size: .6em; line-height: 0; vertical-align: baseline; position: relative; margin-left: .06em; }
.key sup { top: -.95em; }        /* 위로: 위첨자 아랫부분이 밑 글자 윗부분과 맞닿는 높이 */
.key sub { top: .8em; }          /* 아래로: 아래첨자가 밑 글자의 기준선 아래로 내려오게 */
.key sub:first-child { margin-left: 0; margin-right: .06em; }   /* ₙPᵣ 의 앞쪽 n */
.key sup:first-child { margin-left: 0; margin-right: -.1em; }   /* ʸ√ 의 차수 */
.k-num { background: var(--num-bg); color: var(--num-fg); font-size: 22px; }
.k-fn  { background: var(--fn-bg);  color: var(--fn-fg);  font-size: 16px; }
.k-op  { background: var(--op-bg);  color: var(--op-fg);  font-size: 24px; }
.k-ctl { background: var(--ctl-bg); color: var(--ctl-fg); font-size: 16px; }
.k-eq  { background: var(--eq-bg);  color: var(--eq-fg);  font-size: 26px; font-weight: 800; }
.k-pin { background: var(--pin-bg); color: var(--pin-fg); font-size: 20px; box-shadow: inset 0 0 0 2px var(--pin-line), var(--shadow); }
/* 버튼 위 작은 빈칸 그림 (누르면 이런 빈칸이 생긴다는 뜻) */
.kbox { display: inline-block; width: .62em; height: .72em; border: 1.5px solid currentColor; border-radius: 2px; vertical-align: -.05em; opacity: .9; }
.key sup .kbox, .key sub .kbox { width: .8em; height: .9em; vertical-align: baseline; }
.kfrac { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; vertical-align: middle; }
.kfrac .kbox { width: .62em; height: .5em; }   /* 키가 낮아져도 넘치지 않게 작게 */
.kfrac .kbox:first-child { border-bottom-width: 1.5px; }
.kfrac::after { content: ""; order: 1; width: 1.1em; height: 2px; background: currentColor; }
.kfrac .kbox:last-child { order: 2; }
.k-small { font-size: 14px !important; }
.k-tiny  { font-size: 13px !important; }
[data-theme="contrast"] .k-fn, [data-theme="contrast"] .k-op, [data-theme="contrast"] .k-ctl { box-shadow: inset 0 0 0 2px #fff; }

/* =========================================================
   7. 계산 기록 창
   ========================================================= */
.history {
  background: var(--panel-bg); color: var(--panel-fg);
  border-radius: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
[data-theme="contrast"] .history { border: 2px solid #fff; }
.h-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.h-head h2 { margin: 0; font-size: 16px; flex: 1 1 auto; white-space: nowrap; }
.h-btn {
  height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.h-btn.danger.armed { background: var(--err); color: #fff; border-color: var(--err); }
.h-close { display: none; }
.h-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 4px 0; -webkit-overflow-scrolling: touch; }
.h-item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
}
.h-meta { grid-column: 1 / 2; font-size: 11px; color: var(--muted); }
.h-expr {
  grid-column: 1 / 2; min-width: 0; text-align: left; border: 0; background: transparent; color: inherit;
  padding: 2px 0; cursor: pointer; overflow-x: auto; white-space: nowrap;
  font-family: "Cambria Math", "Times New Roman", serif; font-size: 17px;
}
.h-res {
  grid-column: 1 / 2; min-width: 0; text-align: right; border: 0; background: transparent; color: var(--accent);
  padding: 2px 0; cursor: pointer; font-size: 19px; font-weight: 800; overflow-x: auto; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.h-del {
  grid-column: 2 / 3; grid-row: 1 / 4; align-self: center;
  width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font-size: 16px; cursor: pointer;
}
.h-empty { padding: 24px 16px; color: var(--muted); font-size: 14px; line-height: 1.7; }
.h-empty code { background: var(--line); color: var(--panel-fg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.h-tip { flex: none; padding: 6px 12px 10px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); line-height: 1.5; }

/* 휴대폰 화면용: 기록은 아래에서 올라오는 창 */
.backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }
@media (max-width: 759.98px) {
  .history {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: 82dvh; max-height: 82vh;
    border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    transform: translateY(105%); transition: transform .25s ease;
    visibility: hidden;
  }
  .history.open { transform: translateY(0); visibility: visible; }
  .backdrop.open { display: block; }
  .h-close { display: inline-block; }
  .calc { max-width: 560px; }
}
/* 넓은 화면용: 나란히 보기 */
@media (min-width: 760px) {
  #btnHistory { display: none; }
  .history { flex: 0 1 380px; width: 380px; }
  .layout { padding: 0 16px 16px; }
}
/* 노트북 큰 화면: 키 글자 조금 크게 */
@media (min-width: 1100px) {
  .history { flex-basis: 440px; width: 440px; }
}

/* 세로가 짧은 휴대폰(아이폰 SE 등): 화면 영역을 조금 줄임 */
@media (max-height: 700px) {
  .topbar { height: 42px; }
  .layout { height: calc(100dvh - 42px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  .editor { min-height: 60px; font-size: 23px; }
  .result { min-height: 34px; font-size: 26px; }
  .keys { gap: 5px; grid-template-rows: 30px repeat(3, minmax(31px, 1fr)) minmax(34px, 1.1fr) minmax(31px, .85fr) repeat(4, minmax(36px, 1.25fr)); }
  .k-num { font-size: 20px; }
}
/* 아주 낮은 화면(세로 600px 이하, 예: 작은 휴대폰): 한 화면에 다 들어오게 더 줄임 */
@media (max-height: 600px) {
  .topbar { height: 38px; }
  .layout { height: calc(100dvh - 38px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 480px; padding-bottom: 6px; }
  .display { padding: 4px 10px 6px; }
  .disp-top { min-height: 18px; }
  .editor { min-height: 54px; font-size: 22px; padding: 3px 2px; }
  /* 버튼이 낮으므로 첨자 위치를 조금만 덜 올리고 내림 (버튼 밖으로 안 나가게) */
  .key sup { top: -.8em; }
  .key sub { top: .55em; }
  .key .kl:has(sub) { transform: translateY(-.15em); }
  .result { min-height: 30px; font-size: 24px; }
  .keys { gap: 4px; grid-template-rows: 28px repeat(3, minmax(29px, 1fr)) minmax(32px, 1.1fr) minmax(29px, .85fr) repeat(4, minmax(34px, 1.25fr)); }
}
/* 아주 좁은 화면(폭 340px 이하) */
@media (max-width: 340px) {
  .k-fn { font-size: 14px; }
  .k-small { font-size: 12.5px !important; }
  .k-tiny { font-size: 11.5px !important; }
  .keys { gap: 5px; }
  .topbar h1 { font-size: 16px; }
  .top-btn { padding: 0 9px; font-size: 13px; }
}

/* =========================================================
   8. 테마 선택 창, 알림 메시지
   ========================================================= */
.theme-menu {
  position: fixed; top: 52px; right: 10px; z-index: 40;
  background: var(--panel-bg); color: var(--panel-fg);
  border-radius: 14px; padding: 10px; width: 230px; max-width: calc(100vw - 20px);
  box-shadow: 0 8px 30px rgba(0,0,0,.3);
  display: none;
}
.theme-menu.open { display: block; }
.theme-menu h3 { margin: 2px 4px 8px; font-size: 14px; }
.theme-opt {
  width: 100%; display: flex; align-items: center; gap: 10px;
  border: 1px solid transparent; background: transparent; color: inherit;
  padding: 7px 8px; border-radius: 10px; cursor: pointer; font-size: 14px; text-align: left;
}
.theme-opt.on { border-color: var(--accent); font-weight: 800; }
.swatch { flex: none; width: 34px; height: 22px; border-radius: 6px; display: flex; overflow: hidden; border: 1px solid rgba(0,0,0,.2); }
.swatch i { flex: 1; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: rgba(20,20,20,.9); color: #fff; padding: 10px 16px; border-radius: 20px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 50; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* =========================================================
   9. 계산기 / 그래프 전환
   ========================================================= */
.topbar .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mode-seg { flex: none; display: flex; gap: 2px; padding: 3px; border-radius: 18px; background: rgba(0,0,0,.16); }
.mode-seg button {
  height: 30px; padding: 0 13px; border: 0; border-radius: 15px; background: transparent;
  color: var(--head-fg); font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.mode-seg button.on { background: var(--display-bg); color: var(--display-fg); box-shadow: var(--shadow); }
[data-theme="contrast"] .mode-seg { background: #000; border: 2px solid #fff; }
@media (max-width: 479.98px) { .topbar h1 { display: none; } }   /* 휴대폰에서는 제목 대신 전환 버튼 */

/* 모드마다 보이는 부분 */
.app[data-mode="graph"] .display,
.app[data-mode="graph"] .history,
.app[data-mode="graph"] #btnHistory,
.app[data-mode="graph"] .backdrop { display: none !important; }
.app[data-mode="calc"] .fpanel,
.app[data-mode="calc"] .graph { display: none !important; }

/* =========================================================
   10. 그래프: 함수 목록 (y = …)
   ========================================================= */
.fpanel {
  flex: none; min-height: 0; min-width: 0;
  background: var(--display-bg); color: var(--display-fg);
  border-radius: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.f-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 10px 4px; }
.f-head b { flex: 1 1 auto; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-btn {
  flex: none; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--display-fg); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.f-btn:disabled { opacity: .4; cursor: default; }
.f-btn .short { display: none; }
/* 문자(계수·상수) 값 입력 칸 */
.p-panel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.p-panel[hidden] { display: none !important; }
.p-panel.c { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding-top: 6px; border-top: 1px dashed var(--line); }
.p-title { font-size: 12px; color: var(--muted); font-weight: 700; }
.p-chip { display: flex; align-items: center; gap: 4px; }
.p-chip .p-val { width: 76px; }
.p-panel.g { flex: none; padding: 4px 10px 6px; border-top: 1px dashed var(--line); max-height: 150px; overflow-y: auto; }
.p-row { display: grid; grid-template-columns: auto 66px minmax(0, 1fr) 34px; align-items: center; gap: 8px; min-height: 32px; }
.p-name { font-family: "Cambria Math", "Times New Roman", serif; font-size: 18px; white-space: nowrap; }
.p-name i { font-style: italic; }
.p-val {
  width: 100%; min-width: 0; height: 30px; padding: 0 6px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--panel-bg); color: var(--panel-fg);
  font-size: 16px; font-family: inherit;      /* 16px 이상: 아이폰에서 확대되지 않게 */
}
.p-val.bad { border-color: var(--err); box-shadow: 0 0 0 1px var(--err); }
.p-sl { width: 100%; min-width: 0; accent-color: var(--accent); }
.p-play { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--display-fg); font-size: 12px; cursor: pointer; }
.p-play.on { background: var(--accent); border-color: var(--accent); color: #fff; }
/* 그래프 왼쪽 위 범례 (휴대폰) */
.g-legend {
  position: absolute; left: 8px; top: 48px; display: none; flex-direction: column; align-items: flex-start; gap: 3px;
  max-width: 62%; max-height: 48%; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin;   /* 많으면 범례 안에서 스크롤 */
}
.g-legend[hidden] { display: none !important; }
.g-leg {
  flex: none;   /* 범례 칸이 좁아도 이름표가 눌려 찌그러지지 않게 */
  display: flex; align-items: center; gap: 6px; max-width: 100%; min-height: 26px; padding: 1px 8px 1px 6px;
  border-radius: 8px; border: 1px solid var(--line); cursor: pointer; text-align: left;
  background: color-mix(in srgb, var(--display-bg) 90%, transparent); color: var(--display-fg);
  font-family: "Cambria Math", "Times New Roman", serif; font-size: 15px; white-space: nowrap; overflow: hidden;
}
.g-leg.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.g-leg.off { opacity: .45; }
.g-leg > i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.g-leg .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.g-leg em { font-style: italic; }
.g-slope { display: inline-block; padding-left: 16px; }
.f-list { flex: 1 1 auto; min-height: 0; max-height: 156px; overflow-y: auto; padding: 0 6px 6px; }
.f-row {
  display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; column-gap: 6px;
  padding: 1px 6px; margin-top: 3px; border: 2px solid transparent; border-radius: 10px; cursor: pointer;
}
.f-row.on { border-color: var(--accent); }
.f-dot {   /* 색 점: 누르면 그래프 보이기/숨기기 */
  width: 22px; height: 22px; padding: 0; border-radius: 50%;
  border: 3px solid var(--c); background: var(--c); cursor: pointer;
}
.f-dot.off { background: transparent; }
.f-y { font-family: "Cambria Math", "Times New Roman", serif; font-size: 20px; white-space: nowrap; opacity: .55; }
.f-y i { font-style: italic; }
.f-expr {
  min-width: 0; min-height: 42px; overflow-x: auto; overflow-y: hidden; white-space: nowrap;
  display: flex; align-items: center;
  font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 21px;
}
.f-row.on .f-expr { overflow: hidden; }
.f-row .editor { flex: 1 1 auto; width: 100%; min-height: 42px; font-size: 22px; padding: 2px 0; border-bottom: 0; }
.f-row .editor .hint { white-space: nowrap; }
.f-empty { font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); }
.f-del {
  width: 28px; height: 28px; border-radius: 14px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font-size: 15px; cursor: pointer;
}
.f-err { grid-column: 3 / 5; font-family: system-ui, sans-serif; font-size: 12px; color: var(--muted); line-height: 1.3; padding-bottom: 3px; }
.f-err:empty { display: none; }
.m-var { font-style: italic; }       /* 변수 x, y */
.m-rel { margin: 0 .3em; }           /* 등호, 부등호 */
/* 미분: d/dx (식) |x=값 */
.m-ddx { font-style: italic; font-size: .72em; margin-right: .04em; }
.m-at { display: inline-block; border-left: 1.5px solid currentColor; margin-left: .06em; padding: .9em 0 0 .1em; vertical-align: -.45em; line-height: 1; }
.m-at > .m-sub { vertical-align: baseline; }
/* 정적분: ∫ (아래끝 위끝) 식 dx */
.m-int { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 .05em; }
.m-intsign { font-size: 1.6em; line-height: 1; font-style: normal; }
.m-lim { display: inline-flex; flex-direction: column; justify-content: space-between; align-self: stretch;
         font-size: .62em; line-height: 1; margin: 0 .22em 0 .02em; min-height: 2.4em; }
.m-dx { margin-left: .2em; font-style: italic; }
.m-nabla { font-style: normal; margin-right: .02em; }
.m-ph.ghost { opacity: .5; }        /* 그래디언트에서 아직 안 넣은 좌표 자리 */
/* 버튼 위 d/dx, ∫ 의 위·아래 빈칸 */
.kdfrac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .68em; line-height: 1.05; font-style: italic; margin-right: .05em; }
.kdfrac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .2em; }
.klim { display: inline-flex; flex-direction: column; justify-content: space-between; vertical-align: middle; gap: .5em; margin-left: .04em; font-size: .7em; }
.kx { font-family: "Times New Roman", serif; font-style: italic; font-size: 1.3em; font-weight: 700; }

/* =========================================================
   11. 그래프: 그리는 영역
   ========================================================= */
.graph {
  position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background: var(--panel-bg); color: var(--panel-fg);
  border-radius: 16px; box-shadow: var(--shadow);
}
[data-theme="contrast"] .graph, [data-theme="contrast"] .fpanel { border: 2px solid #fff; }
#gCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.g-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 16px); }
.g-btn {
  min-width: 36px; height: 34px; padding: 0 8px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--display-bg); color: var(--display-fg);
  font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap;
}
.g-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
[data-theme="contrast"] .g-btn.on, [data-theme="night"] .g-btn.on { color: #000; }
.g-info {   /* 추적한 점의 좌표 */
  position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px);
  padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--display-bg); color: var(--display-fg);
  font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; pointer-events: none;
}
.g-info.show { display: block; }
.g-info i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

/* ---------- 그래프 모드 배치 ----------
   좁은 화면(휴대폰, 태블릿 세로): 위 그래프 / 가운데 식 목록 / 아래 키패드
   넓은 화면(노트북, 태블릿 가로): 왼쪽 식 목록+키패드 / 오른쪽 큰 그래프 */
@media (max-width: 899.98px) {
  .app[data-mode="graph"] .layout {
    flex-direction: column; align-items: center; gap: 8px;
    height: auto; min-height: calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  .app[data-mode="graph"] .graph { order: -1; flex: 1 1 auto; width: 100%; min-height: 200px; }
  .app[data-mode="graph"] .calc { flex: none; gap: 6px; }
  /* 식 목록: 입력 중인 식 한 줄만 (다른 식은 그래프 왼쪽 위 범례로) + 오른쪽에 작은 버튼 두 개 */
  .app[data-mode="graph"] .fpanel { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .app[data-mode="graph"] .p-panel.g { order: 3; flex: 0 0 100%; max-height: 76px; }   /* 문자 값: 2줄까지 보이고 나머지는 스크롤 */
  .app[data-mode="graph"] .f-list { order: 1; flex: 1 1 0; min-width: 0; max-height: none; overflow: visible; padding: 4px 0 4px 6px; }
  .app[data-mode="graph"] .f-err { white-space: normal; }      /* 안내 문구는 줄을 바꿔서 (버튼을 밀어내지 않게) */
  .app[data-mode="graph"] .f-row { margin-top: 0; }
  .app[data-mode="graph"] .f-row:not(.on) { display: none; }
  .app[data-mode="graph"] .f-head { order: 2; flex-direction: column; align-items: stretch; gap: 4px; padding: 4px 6px 4px 2px; }
  .app[data-mode="graph"] .f-head b { display: none; }
  .app[data-mode="graph"] .f-btn { height: 26px; padding: 0 8px; font-size: 12.5px; }
  .app[data-mode="graph"] .f-btn .long { display: none; }
  .app[data-mode="graph"] .f-btn .short { display: inline; }
  .app[data-mode="graph"] .g-legend { display: flex; }
  /* 키패드: 촘촘하게 */
  .app[data-mode="graph"] .keys { flex: none; gap: 4px; grid-template-rows: 28px repeat(3, 30px) 34px 30px repeat(4, 34px); }
  /* 함수 줄을 접으면 함수 키 3줄을 숨기고 그만큼 그래프가 커짐 */
  .app[data-mode="graph"].fn-fold .keys { grid-template-rows: 28px 34px 30px repeat(4, 34px); }
  .app[data-mode="graph"].fn-fold .key[data-group="fn"] { display: none; }
  .app[data-mode="graph"].kbd-hidden .keys { display: none; }
  .app[data-mode="graph"] .tab { font-size: 13px; letter-spacing: -.3px; }
  .app[data-mode="graph"] .tab.on::after { content: " ▴"; font-size: .8em; }   /* 다시 누르면 접힘 */
}
/* 세로가 짧은 휴대폰 */
@media (max-width: 899.98px) and (max-height: 760px) {
  .app[data-mode="graph"] .graph { min-height: 160px; }
  .app[data-mode="graph"] .keys { grid-template-rows: 26px repeat(3, 28px) 32px 28px repeat(4, 32px); }

<script>
"use strict";
/* =====================================================================
   0. 화면 요소 찾아두기
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const editorEl = $("editor");    // 교과서 모양 수식 입력칸
const resultEl = $("result");    // 결과 줄
const keysEl   = $("keys");      // 키패드 격자
const tabsEl   = $("tabs");      // 탭 줄
const hListEl  = $("hList");     // 기록 목록

/* 터치 화면(휴대폰, 태블릿)인지 확인 → 터치 화면이면 자판이 안 뜨게 함 */
const IS_TOUCH = window.matchMedia("(pointer: coarse)").matches;

/* 계산기 상태 */
const state = {
  deg: true,            // true: 각도를 도(DEG)로, false: 라디안(RAD)
  ans: 0,               // 직전 계산 결과 (Ans)
  justEvaluated: false, // 방금 = 을 눌렀는지
  tab: "basic",         // 지금 보고 있는 함수 탭
  nativeKbd: false,     // 휴대폰 자판 사용 여부
};
// 문자(계수·상수) 값: 계산기와 그래프가 함께 씀
const PARAMS = {};      // 이름 → { value, min, max, playing, dir }
const PV = {};          // 이름 → 값 (계산할 때 찾아보는 표)
const history = [];     // 계산 기록 (새로고침 전까지 누적)
let historyNo = 0;      // 기록 번호

/* =====================================================================
   1. 수식 읽기 (토큰 나누기)
   - "2sin(30)+√(4)" 같은 글자를 숫자, 기호, 함수 이름 조각으로 나눔
   ===================================================================== */
class CalcError extends Error {}   // 학생에게 보여줄 오류 메시지용

// 함수 이름 목록 (소문자로 비교) → 실제 이름
const FUNC_NAMES = {
  asinh:"asinh", acosh:"acosh", atanh:"atanh", sinh:"sinh", cosh:"cosh", tanh:"tanh",
  asin:"asin", acos:"acos", atan:"atan", sin:"sin", cos:"cos", tan:"tan",
  sqrt:"sqrt", cbrt:"cbrt", root:"root", log:"log", ln:"ln", exp:"exp", abs:"abs",
  floor:"floor", ceil:"ceil", round:"round", npr:"nPr", ncr:"nCr", mod:"mod",
  gcd:"gcd", lcm:"lcm", max:"max", min:"min", mean:"mean", rand:"rand",
  diff:"diff", integ:"integ", grad:"grad",                      // 미분, 적분, 그래디언트
};
// 글자 이름들을 긴 것부터 맞춰보기 위해 정렬 (예: "sinh"를 "sin"+"h"로 잘못 읽지 않도록)
const WORDS = Object.keys(FUNC_NAMES).concat(["ans", "pi", "e", "x", "y"]).sort((a, b) => b.length - a.length);

function tokenize(src) {
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }                       // 빈칸은 무시

    // --- 숫자 (예: 12, 3.5, .5, 3.) ---
    if (/[0-9.]/.test(c)) {
      const m = src.slice(i).match(/^(\d+\.?\d*|\.\d*)/)[0];
      if (src[i + m.length] === ".") throw new CalcError("소수점이 두 번 들어갔어요");
      if (m === ".") throw new CalcError("소수점 앞뒤에 숫자를 넣어 주세요");
      tokens.push({ type: "num", value: parseFloat(m), text: m });
      i += m.length; continue;
    }
    // --- 위첨자 ², ³ 는 ^2, ^3 으로 바꿔 읽기 ---
    if (c === "²" || c === "³") {
      tokens.push({ type: "op", v: "^" });
      tokens.push({ type: "num", value: c === "²" ? 2 : 3, text: c === "²" ? "2" : "3" });
      i++; continue;
    }
    // --- 기호들 ---
    if (c === "+") { tokens.push({ type: "op", v: "+" }); i++; continue; }
    if (c === "-" || c === "−" || c === "–") { tokens.push({ type: "op", v: "-" }); i++; continue; }
    if (c === "*" || c === "×" || c === "·") { tokens.push({ type: "op", v: "×" }); i++; continue; }
    if (c === "/" || c === "÷") { tokens.push({ type: "op", v: "÷" }); i++; continue; }
    if (c === "^") { tokens.push({ type: "op", v: "^" }); i++; continue; }
    if (c === "!") { tokens.push({ type: "op", v: "!" }); i++; continue; }
    if (c === "%") { tokens.push({ type: "op", v: "%" }); i++; continue; }
    if (c === "(" || c === "[") { tokens.push({ type: "(" }); i++; continue; }
    if (c === ")" || c === "]") { tokens.push({ type: ")" }); i++; continue; }
    if (c === ",") { tokens.push({ type: "," }); i++; continue; }
    if (c === "√") { tokens.push({ type: "func", name: "sqrt" }); i++; continue; }
    if (c === "∛") { tokens.push({ type: "func", name: "cbrt" }); i++; continue; }
    if (c === "π") { tokens.push({ type: "const", name: "pi" }); i++; continue; }
    if (c === "□") { tokens.push({ type: "ph" }); i++; continue; }        // 아직 안 채운 빈칸

    // --- 영어 글자: 함수 이름, Ans, pi, e ---
    if (/[A-Za-z]/.test(c)) {
      const run = src.slice(i).match(/^[A-Za-z]+/)[0];
      let j = 0;
      while (j < run.length) {
        const rest = run.slice(j).toLowerCase();
        const w = WORDS.find((word) => rest.startsWith(word));
        if (!w) {
          // 함수 이름이 아닌 소문자 한 글자는 문자(계수·상수, 변수)로 읽음
          if (/[a-z]/.test(run[j])) { tokens.push({ type: "var", name: run[j] }); j++; continue; }
          throw new CalcError(`알 수 없는 글자 '${run[j]}' 가 있어요 (문자는 소문자로 써요)`);
        }
        if (w === "ans") tokens.push({ type: "ans" });
        else if (w === "pi") tokens.push({ type: "const", name: "pi" });
        else if (w === "e") tokens.push({ type: "const", name: "e" });
        else if (w === "x" || w === "y") tokens.push({ type: "var", name: w });   // 그래프용 변수 x, y
        else tokens.push({ type: "func", name: FUNC_NAMES[w] });
        j += w.length;
      }
      i += run.length; continue;
    }
    throw new CalcError(`사용할 수 없는 기호 '${c}' 가 있어요`);
  }
  return tokens;
}

/* =====================================================================
   2. 수식 구조 만들기 (파서)
   - 계산 순서: 괄호 → 함수 → 거듭제곱 → 부호 → 곱셈·나눗셈 → 덧셈·뺄셈
   - 2π, 3sin(30), 2(3+4) 처럼 곱하기 기호를 생략해도 곱셈으로 처리
   - 닫는 괄호를 빼먹어도 끝에서 자동으로 닫아줌
   - lenient(너그러운 모드): 아직 덜 쓴 식도 미리보기용으로 빈칸(□)을 넣어 만들어 줌
   ===================================================================== */
class Parser {
  constructor(tokens, lenient) { this.t = tokens; this.p = 0; this.lenient = lenient; }
  peek() { return this.t[this.p]; }
  next() { return this.t[this.p++]; }
  isOp(v) { const k = this.peek(); return k && k.type === "op" && k.v === v; }

  // 전체 식 읽기
  parseAll() {
    if (this.t.length === 0) {
      if (this.lenient) return { type: "ph" };
      throw new CalcError("수식을 입력해 주세요");
    }
    const node = this.parseAdd();
    if (this.p < this.t.length) {
      const k = this.peek();
      if (k.type === ")") throw new CalcError("여는 괄호 없이 닫는 괄호 ')' 가 있어요");
      if (k.type === ",") throw new CalcError("쉼표(,)는 함수 괄호 안에서만 써요");
      throw new CalcError("수식 모양이 올바르지 않아요");
    }
    return node;
  }
  // 덧셈, 뺄셈
  parseAdd() {
    let left = this.parseMul();
    while (this.isOp("+") || this.isOp("-")) {
      const op = this.next().v;
      left = { type: "bin", op, l: left, r: this.parseMul() };
    }
    return left;
  }
  // 곱셈, 나눗셈, 생략된 곱셈
  parseMul() {
    let left = this.parseUnary();
    for (;;) {
      if (this.isOp("×") || this.isOp("÷")) {
        const op = this.next().v;
        left = { type: "bin", op, l: left, r: this.parseUnary() };
      } else if (this.startsValue(this.peek())) {
        // 2π, 3(4+5) 처럼 기호 없이 붙어 있으면 곱셈
        left = { type: "bin", op: "imp", l: left, r: this.parseUnary() };
      } else break;
    }
    return left;
  }
  // 바로 값이 시작되는 조각인지 (생략된 곱셈 판단용)
  startsValue(k) {
    return !!k && (k.type === "num" || k.type === "const" || k.type === "ans" || k.type === "func" || k.type === "(" || k.type === "ph" || k.type === "var");
  }
  // 음수 부호 (-2^2 = -4 가 되도록 거듭제곱보다 나중에 계산)
  parseUnary() {
    if (this.isOp("-")) { this.next(); return { type: "neg", a: this.parseUnary() }; }
    if (this.isOp("+")) { this.next(); return this.parseUnary(); }
    return this.parsePow();
  }
  // 거듭제곱 (오른쪽부터 계산: 2^3^2 = 2^9)
  parsePow() {
    const base = this.parsePostfix();
    if (this.isOp("^")) { this.next(); return { type: "pow", b: base, e: this.parseUnary() }; }
    return base;
  }
  // 뒤에 붙는 기호: 계승(!), 퍼센트(%)
  parsePostfix() {
    let node = this.parsePrimary();
    while (this.isOp("!") || this.isOp("%")) {
      node = { type: this.next().v === "!" ? "fact" : "pct", a: node };
    }
    return node;
  }
  // 가장 작은 단위: 숫자, 상수, 괄호, 함수
  parsePrimary() {
    const k = this.peek();
    if (!k || k.type === ")" || k.type === "," || (k.type === "op" && !["-", "+"].includes(k.v))) {
      // 값이 와야 할 자리가 비어 있음
      if (this.lenient) return { type: "ph" };
      if (!k) throw new CalcError("수식을 끝까지 입력해 주세요");
      if (k.type === ")") throw new CalcError("괄호 안이 비어 있어요");
      if (k.type === ",") throw new CalcError("빈칸이 있어요. 값을 넣어 주세요");
      throw new CalcError(`'${k.v}' 앞에 값이 필요해요`);
    }
    if (k.type === "op") return this.parseUnary();   // 2×-3 같은 경우
    this.next();
    if (k.type === "ph") return { type: "ph" };
    if (k.type === "var") return { type: "var", name: k.name };
    if (k.type === "num") return { type: "num", v: k.value, text: k.text };
    if (k.type === "const") return { type: "const", name: k.name };
    if (k.type === "ans") return { type: "ans" };
    if (k.type === "(") {
      const inner = this.parseAdd();
      const closed = this.closeParen();
      return { type: "group", a: inner, closed };
    }
    if (k.type === "func") {
      // 괄호 없이 쓴 경우: sin30, √4
      if (!this.peek() || this.peek().type !== "(") {
        return { type: "func", name: k.name, args: [this.parseUnary()], closed: true, noParen: true };
      }
      this.next(); // "(" 건너뛰기
      const args = [];
      if (this.peek() && this.peek().type === ")") {
        this.next();
        return { type: "func", name: k.name, args, closed: true };
      }
      if (!this.peek()) {          // "sin(" 까지만 쓴 상태
        if (this.lenient) return { type: "func", name: k.name, args: [{ type: "ph" }], closed: false };
        throw new CalcError("수식을 끝까지 입력해 주세요");
      }
      args.push(this.parseAdd());
      while (this.peek() && this.peek().type === ",") { this.next(); args.push(this.parseAdd()); }
      const closed = this.closeParen();
      return { type: "func", name: k.name, args, closed };
    }
    throw new CalcError("수식 모양이 올바르지 않아요");
  }
  // 닫는 괄호: 끝까지 없으면 자동으로 닫힌 것으로 봄
  closeParen() {
    const k = this.peek();
    if (k && k.type === ")") { this.next(); return true; }
    if (!k) return false;
    if (k.type === ",") throw new CalcError("쉼표(,)는 함수 괄호 안에서만 써요");
    throw new CalcError("괄호가 맞지 않아요");
  }
}

/* =====================================================================
   3. 계산하기
   ===================================================================== */
const DEG = Math.PI / 180;

// 계승 n! (정수가 아니면 감마함수로 계산)
function factorial(n) {
  if (Number.isInteger(n)) {

// 감마함수 (Lanczos 근사)

// 삼각함수: DEG 모드에서 sin(180)=0 처럼 딱 떨어지는 각은 정확하게

// 함수별 (최소, 최대) 인자 개수
const ARITY = {

  sinh:[1,1], cosh:[1,1], tanh:[1,1], asinh:[1,1], acosh:[1,1], atanh:[1,1],
  sqrt:[1,1], cbrt:[1,1], root:[2,2], log:[1,2], ln:[1,1], exp:[1,1], abs:[1,1],
  floor:[1,1], ceil:[1,1], round:[1,2], nPr:[2,2], nCr:[2,2], mod:[2,2],

// 사람이 읽기 좋은 함수 이름 (오류 메시지용)
const NICE = { asin:"sin⁻¹", acos:"cos⁻¹", atan:"tan⁻¹", asinh:"sinh⁻¹", acosh:"cosh⁻¹", atanh:"tanh⁻¹", sqrt:"√", cbrt:"∛", root:"거듭제곱근", diff:"미분", integ:"적분", grad:"∇" };

function evaluate(node, ctx) {

function evalFunc(node, ctx) {

    throw new CalcError(`${nice} 에 넣은 값의 개수가 맞지 않아요`);

  const x = a[0];

  switch (f) {
    case "sin": case "cos": case "tan": return trig(f, x, deg);
    case "asin": case "acos": if (x < -1 || x > 1) domain(); return deg ? Math[f](x) / DEG : Math[f](x);
    case "atan": return deg ? Math.atan(x) / DEG : Math.atan(x);
    case "sinh": case "cosh": case "tanh": case "asinh": return Math[f](x);
    case "acosh": if (x < 1) domain(); return Math.acosh(x);
    case "atanh": if (x <= -1 || x >= 1) domain(); return Math.atanh(x);
    case "sqrt": if (x < 0) throw new CalcError("음수의 제곱근은 실수 범위에서 계산할 수 없어요"); return Math.sqrt(x);
    case "cbrt": return Math.cbrt(x);
    case "root": {                                  // root(n, x) = x 의 n제곱근
      const n = a[0], v = a[1];

    case "ceil": return Math.ceil(x);
    case "round": {

/* =====================================================================
   3-1. 미분·적분·그래디언트 (수치 계산)
   - diff(식, a, 변수)       : 변수 = a 에서의 미분계수 (변수를 안 쓰면 x)
   - integ(식, a, b, 변수)   : a 부터 b 까지 정적분 (d변수)
   - grad(식, p1, p2, p3)    : 점 (x, y, z) = (p1, p2, p3) 에서의 기울기 벡터 ∇f (맨 바깥에서만)
   식 안의 그 변수만 바꿔 가며 계산하고, 나머지 문자는 따로 입력한 값을 씀
   ===================================================================== */
// 변수 칸 → 변수 이름 (칸이 없으면 x)
function calcVar(arg) {

function evalCalculus(node, ctx) {
  const body = node.args[0];
  if (node.name === "grad") throw new CalcError("∇(그래디언트)는 벡터라서 다른 계산과 섞어 쓸 수 없어요. ∇ 하나만 계산해 주세요");
  const c2 = Object.assign({}, ctx);                     // 식 안의 변수만 바꿔 계산하기 위한 복사본
  if (node.name === "diff") {
    if (node.args.length < 1 || node.args.length > 3) throw new CalcError("미분 상자의 모양이 올바르지 않아요");
    let a;

    const vn = calcVar(node.args[2]);                      // 미분할 변수 (d/dx, d/dy …)
    return numDiff((t) => { c2[vn] = t; return evaluate(body, c2); }, a);

  if (node.args.length < 3 || node.args.length > 4) throw new CalcError("적분 상자의 모양이 올바르지 않아요");

  const F = (t) => { c2[vn] = t; return evaluate(body, c2); };
  return numInteg(F, evaluate(node.args[1], ctx), evaluate(node.args[2], ctx));
}
// 그래디언트 ∇f: 점의 좌표 개수(1~3)에 맞춰 x, y, z 로 각각 미분 (나머지 변수는 그 점의 값으로 고정)
function calcGrad(node, ctx) {
  const body = node.args[0];
  const pts = node.args.slice(1).map((a) => evaluate(a, ctx));
  if (pts.length < 1 || pts.length > 3) throw new CalcError("∇ 의 점은 (x, y) 또는 (x, y, z) 처럼 쉼표로 구분해 써요");

  const fv = freeVars(body);
  const need = fv.has("z") ? 3 : fv.has("y") ? 2 : 1;
  if (pts.length < need) {
    const list = ["x", "y", "z"].slice(0, need).join(", ");
    throw new CalcError(`식에 ${need === 3 ? "z" : "y"} 가 있어서 점의 좌표를 ${need}개 넣어야 해요 (${list})`);

  const base = Object.assign({}, ctx);
  names.forEach((n, i) => { base[n] = pts[i]; });
  return names.map((n, i) => {
    const c3 = Object.assign({}, base);
    return numDiff((t) => { c3[n] = t; return evaluate(body, c3); }, pts[i]);
  });
}
// 식에서 값이 정해지지 않은 문자 찾기 (미분·적분 변수로 묶인 문자는 제외)
function freeVars(node, bound, out) {
  bound = bound || new Set(); out = out || new Set();
  if (!node || typeof node !== "object") return out;
  if (node.type === "var") { if (!bound.has(node.name)) out.add(node.name); return out; }
  if (node.type === "func" && (node.name === "diff" || node.name === "integ" || node.name === "grad")) {
    const args = node.args || [];
    const vIdx = node.name === "diff" ? 2 : node.name === "integ" ? 3 : -1;     // 변수 칸의 위치
    const inner = new Set(bound);
    if (node.name === "grad") ["x", "y", "z"].forEach((n) => inner.add(n));
    else inner.add(args[vIdx] && args[vIdx].type === "var" ? args[vIdx].name : "x");
    freeVars(args[0], inner, out);                                            // 식 안: 변수는 묶여 있음
    args.slice(1).forEach((a, i) => { if (i + 1 !== vIdx) freeVars(a, bound, out); });   // 끝값, 점 좌표
    return out;
  }
  Object.values(node).forEach((v) => {
    if (Array.isArray(v)) v.forEach((c) => freeVars(c, bound, out));
    else if (v && typeof v === "object" && v.type) freeVars(v, bound, out);
  });
  return out;
}

// 미분계수: 양쪽으로 조금씩 떨어진 두 점의 기울기 (간격을 두 번 바꿔 오차를 줄임: 리처드슨 외삽)
function numDiff(F, a) {
  const f = (t) => { const v = F(t); if (!Number.isFinite(v)) throw new CalcError(""); return v; };
  try {
    const h = 1e-3 * Math.max(1, Math.abs(a));
    const D = (s) => (f(a + s) - f(a - s)) / (2 * s);
    const r = (4 * D(h / 2) - D(h)) / 3;
    // 뾰족한 점(예: |x| 의 x = 0) 확인: 아주 가까운 왼쪽 기울기와 오른쪽 기울기가 다르면 미분 불가
    const e = 1e-6 * Math.max(1, Math.abs(a)), f0 = f(a);
    const L = (f0 - f(a - e)) / e, R = (f(a + e) - f0) / e;
    if (!Number.isFinite(r) || Math.abs(L - R) > 1e-3 * (1 + Math.abs(r))) throw new CalcError("");
    return Math.abs(r) < 1e-10 ? 0 : r;                  // 0.0000000000001 같은 오차는 0 으로
  } catch (err) {
    if (err instanceof CalcError && err.message.startsWith("문자")) throw err;   // 문자 값이 없다는 안내는 그대로

  }
}

// 정적분: 구간을 반씩 나누며, 나눠도 값이 거의 안 바뀔 때까지 계산 (가우스-르장드르 5점 공식)
// 구간의 끝점에서는 값을 구하지 않으므로 ∫₀¹ 1/√x dx 처럼 끝에서 무한대인 경우도 계산 가능

  if (!Number.isFinite(a) || !Number.isFinite(b)) throw new CalcError("적분 구간을 확인해 주세요");
  if (a === b) return 0;
  if (a > b) return -numInteg(F, b, a);                   // 위끝이 더 작으면 부호만 바뀜
  const X = [0, -0.5384693101056831, 0.5384693101056831, -0.906179845938664, 0.906179845938664];
  const W = [0.5688888888888889, 0.4786286704993665, 0.4786286704993665, 0.2369268850561891, 0.2369268850561891];
  let count = 0;                                          // 계산 횟수 (너무 많으면 멈춤)
  let hitLimit = false;                                   // 아주 잘게 나눠도 안 맞았는지 (끝점에서 무한대인 경우 등)
  let G2 = F;                                             // 실제로 적분할 식 (아래에서 바꿀 수 있음)
  const gl = (lo, hi) => {
    const m = (lo + hi) / 2, r = (hi - lo) / 2;
    let s = 0;
    for (let k = 0; k < 5; k++) {
      let v;
      try { v = G2(m + r * X[k]); } catch (e) {
        if (e instanceof CalcError && e.message.startsWith("문자")) throw e;   // 문자 값이 없다는 안내는 그대로
        v = NaN;
      }
      if (!Number.isFinite(v)) throw new CalcError("적분 구간 안에 정의되지 않는 곳이 있어요");
      s += W[k] * v;
    }
    count += 5;
    return s * r;
  };
  const rec = (lo, hi, whole, tol, depth) => {
    const m = (lo + hi) / 2, L = gl(lo, m), R = gl(m, hi), sum = L + R;
    if (Math.abs(sum - whole) <= tol) return sum;
    if (depth >= 45) { hitLimit = true; return sum; }
    if (count > 200000) throw new CalcError("적분값을 정확히 구하기 어려워요 (구간이나 식을 확인해 주세요)");
    return rec(lo, m, L, tol / 2, depth + 1) + rec(m, hi, R, tol / 2, depth + 1);
